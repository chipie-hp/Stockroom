          '  <div class="recon-metric-box">',
          '    <span style="font-size:0.65rem; text-transform:uppercase; font-weight:700; color:var(--muted); display:block;">Retail Value</span>',
          '    <div class="mono" style="font-size:1.15rem; font-weight:800; color:var(--brass); margin-top:2px;">' + formatMWK(todayVal) + '</div>',
          '    <span style="font-size:0.68rem; color:var(--muted);">Ready for sale</span>',
          '  </div>',
          '</div>',

          '<div class="mb-2">',
          '  <input type="text" id="inv-log-search" class="form-input" placeholder="Search by drink, station, or staff..." value="' + escapeHtml(invLogSearchQuery) + '">',
          '</div>',
          '<div id="issuance-cards-list">'
        ];

        if (list.length === 0) {
          html.push('<div class="card" style="text-align:center; padding:30px 16px; color:var(--muted);">No stock issuances recorded yet. Tap "Issue Stock" to transfer drinks to the bar.</div>');
        } else {
          list.forEach(function(rec) {
            const isReturned = rec.status === 'returned';
            const returnedQty = rec.returnedQty || 0;
            const remainingActive = Math.max(0, Number((rec.qty - returnedQty).toFixed(2)));

            html.push([
              '<div class="card" style="padding:12px 14px; margin-bottom:8px; border-left:4px solid ' + (isReturned ? '#9E9E9E' : 'var(--brass)') + ';">',
              '  <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">',
              '    <div>',
              '      <div style="font-size:0.96rem; font-weight:800; color:var(--ink);">' + escapeHtml(rec.itemName) + '</div>',
              '      <div style="display:flex; align-items:center; gap:6px; margin-top:3px; font-size:0.75rem; color:var(--muted);">',
              '        <span class="mono">' + escapeHtml(rec.date) + ' ' + escapeHtml(rec.time) + '</span>',
              '        <span>•</span>',
              '        <span style="font-weight:600; color:var(--ink);">' + escapeHtml(rec.fromLocation) + ' → ' + escapeHtml(rec.toLocation) + '</span>',
              '      </div>',
              '    </div>',
              '    <div style="text-align:right; flex-shrink:0;">',
              '      <div class="mono" style="font-size:1.15rem; font-weight:800; color:' + (isReturned ? 'var(--muted)' : '#1E663B') + ';">+' + formatNum(rec.qty, 1) + ' ' + escapeHtml(rec.unit) + (rec.qty === 1 ? '' : 's') + '</div>',
              (isReturned ? '      <span style="font-size:0.68rem; background:#E0E0E0; color:#424242; padding:1px 6px; border-radius:4px; font-weight:700;">Returned</span>' : '      <span style="font-size:0.68rem; background:#E5EFE7; color:#1E663B; padding:1px 6px; border-radius:4px; font-weight:700;">Active at Bar</span>'),
              '    </div>',
              '  </div>',
              '  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px; padding-top:8px; border-top:1px solid #F0ECE1; font-size:0.75rem; color:var(--muted); flex-wrap:wrap; gap:6px;">',
              '    <div>',
              '      <span>Issued to: <strong style="color:var(--ink);">' + escapeHtml(rec.issuedTo) + '</strong></span>',
              (rec.issuedBy ? ' <span style="margin-left:4px;">(by ' + escapeHtml(rec.issuedBy) + ')</span>' : ''),
              (rec.notes ? ' <div style="font-style:italic; margin-top:2px; color:var(--ink-2);">"' + escapeHtml(rec.notes) + '"</div>' : ''),
              '    </div>',
              (!isReturned && remainingActive > 0
                ? '    <button type="button" class="btn btn-outline btn-sm btn-return-issuance" data-id="' + rec.id + '" style="min-height:28px; padding:0 8px; font-size:0.72rem;">↩ Return Unsold to Store</button>'
                : (returnedQty > 0 ? '    <span style="font-size:0.72rem; color:var(--muted);">' + returnedQty + ' returned to store</span>' : '')
              ),
              '  </div>',
              '</div>'
            ].join(''));
          });
        }
        html.push('</div>');

        container.innerHTML = html.join('');

        // Event listeners
        const searchLogInput = document.getElementById('inv-log-search');
        if (searchLogInput) {
          searchLogInput.addEventListener('input', function() {
            invLogSearchQuery = this.value;
            renderInventoryLog(container, topNavHtml);
          });
        }

        const btnNewIssue = document.getElementById('btn-log-new-issue');
        if (btnNewIssue) {
          btnNewIssue.addEventListener('click', function() {
            invViewMode = 'issue';
            renderInventory();
          });
        }

        const btnExportCSV = document.getElementById('btn-export-issuances-csv');
        if (btnExportCSV) {
          btnExportCSV.addEventListener('click', exportIssuancesCSV);
        }

        container.querySelectorAll('.btn-return-issuance').forEach(function(btn) {
          btn.addEventListener('click', function() {
            const id = this.getAttribute('data-id');
            openReturnStockSheet(id);
          });
        });
      }

      // Quick Issue Sheet (usable from Catalog row, details sheet, or POS)
      function openQuickIssueSheet(itemId) {
        const item = appState.inventory.find(function(i) { return i.id === itemId; });
        if (!item) return;

        const store = item.storeStock !== undefined ? item.storeStock : 0;
        const bar = item.barStock !== undefined ? item.barStock : item.stock;
        const stations = ['Main Bar', 'Cocktail Station', 'Service Bar', 'VIP Lounge', 'Patio / Garden Bar', 'Counter 1', 'Counter 2'];
        const stationOptions = stations.map(function(s) { return '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>'; }).join('');
        const defaultQty = Math.min(store, 12) || 1;

        const html = [
          '<form id="quick-issue-form">',
          '  <div style="background:#F7F4EC; border:1px solid #E2DCCF; border-radius:8px; padding:10px 12px; margin-bottom:12px;">',
          '    <div style="font-weight:800; font-size:1.05rem; color:var(--ink);">' + escapeHtml(item.name) + '</div>',
          '    <div style="display:flex; gap:12px; margin-top:6px; font-size:0.8rem;">',
          '      <span>🏬 Store: <strong class="mono">' + formatNum(store, 1) + ' ' + escapeHtml(item.baseUnit) + (store === 1 ? '' : 's') + '</strong></span>',
          '      <span>🍸 Bar: <strong class="mono" style="color:#1E663B;">' + formatNum(bar, 1) + ' ' + escapeHtml(item.baseUnit) + (bar === 1 ? '' : 's') + '</strong></span>',
          '    </div>',
          '  </div>',
          '  <div class="form-group" style="margin-bottom:12px;">',
          '    <label style="font-weight:700;">Quantity to Issue (' + escapeHtml(item.baseUnit) + 's) *</label>',
          '    <input type="number" step="any" min="0.5" max="' + store + '" class="form-input mono" id="qi-qty-input" required value="' + defaultQty + '" style="font-size:1.2rem; font-weight:800; height:42px; text-align:center;">',
          '    <div class="pill-grid" style="margin-top:6px;">',
          '      <button type="button" class="pill-btn qi-pill" data-q="1">+1</button>',
          '      <button type="button" class="pill-btn qi-pill" data-q="6">+6</button>',
          '      <button type="button" class="pill-btn qi-pill" data-q="12">+12 (Half Crate)</button>',
          '      <button type="button" class="pill-btn qi-pill" data-q="24">+24 (Crate)</button>',
          (store > 0 ? '      <button type="button" class="pill-btn qi-pill" data-q="' + store + '">All (' + store + ')</button>' : ''),
          '    </div>',
          '  </div>',
          '  <div class="form-group" style="margin-bottom:12px;">',
          '    <label style="font-weight:700;">Destination Station</label>',
          '    <select class="form-select" id="qi-station-select">' + stationOptions + '</select>',
          '  </div>',
          '  <div class="form-group" style="margin-bottom:14px;">',
          '    <label style="font-weight:700;">Staff Receiving</label>',
          '    <input type="text" class="form-input" id="qi-staff-input" value="' + (appState.staffList[0] || 'Bartender') + '">',
          '  </div>',
          (store > 0
            ? '  <button type="submit" class="btn btn-brass btn-block" style="min-height:44px; font-weight:800; font-size:0.95rem;">✓ Confirm &amp; Issue to Bar</button>'
            : '  <div style="color:var(--danger); font-size:0.85rem; text-align:center; font-weight:700; padding:8px;">No stock available in Main Store to issue.</div>'
          ),
          '</form>'
        ].join('');

        openSheet('Issue to Bar: ' + item.name, html, function(closeSheet) {
          const qtyInput = document.getElementById('qi-qty-input');
          document.querySelectorAll('.qi-pill').forEach(function(pill) {
            pill.addEventListener('click', function() {
              if (qtyInput) qtyInput.value = this.getAttribute('data-q');
            });
          });

          const form = document.getElementById('quick-issue-form');
          if (form) {
            form.addEventListener('submit', function(e) {
              e.preventDefault();
              const q = Number(qtyInput.value) || 0;
              const station = document.getElementById('qi-station-select').value;
              const staff = document.getElementById('qi-staff-input').value.trim() || 'Bartender';

              const res = issueStockForSale({
                itemId: item.id,
                qty: q,
                toLocation: station,
                issuedTo: staff,
                issuedBy: 'Storekeeper',
                notes: 'Quick issue to ' + station
              });

              if (res.success) {
                showToast('✓ Issued ' + q + ' ' + item.baseUnit + (q === 1 ? '' : 's') + ' to ' + station);
                closeSheet();
                if (activeTab === 'inventory') renderInventory();
                if (activeTab === 'sell') renderSell();
              } else {
                showToast('Error: ' + res.message);
              }
            });
          }
        });
      }

      // Return Stock Sheet (checking unsold items back into storeroom)
      function openReturnStockSheet(issuanceId) {
        const record = Array.isArray(appState.issuances) ? appState.issuances.find(function(r) { return r.id === issuanceId; }) : null;
        if (!record) return;

        const item = appState.inventory.find(function(i) { return i.id === record.itemId; });
        const maxReturn = Number((record.qty - (record.returnedQty || 0)).toFixed(2));

        const html = [
          '<form id="return-stock-form">',
          '  <div style="background:#F7F4EC; border:1px solid #E2DCCF; border-radius:8px; padding:10px 12px; margin-bottom:12px;">',
          '    <div style="font-weight:800; font-size:1rem; color:var(--ink);">' + escapeHtml(record.itemName) + '</div>',
          '    <div style="font-size:0.78rem; color:var(--muted); margin-top:2px;">Issued: ' + record.qty + ' ' + escapeHtml(record.unit) + 's to ' + escapeHtml(record.toLocation) + '</div>',
          '    <div style="font-size:0.8rem; font-weight:700; color:var(--ink); margin-top:4px;">Max Returnable: ' + maxReturn + ' ' + escapeHtml(record.unit) + 's</div>',
          '  </div>',
          '  <div class="form-group" style="margin-bottom:14px;">',
          '    <label style="font-weight:700;">Quantity to Return to Main Store *</label>',
          '    <input type="number" step="any" min="0.5" max="' + maxReturn + '" class="form-input mono" id="ret-qty-input" required value="' + maxReturn + '" style="font-size:1.2rem; font-weight:800; height:42px; text-align:center;">',
          '    <div class="hint">This moves unused stock from Bar back into the Main Storeroom.</div>',
          '  </div>',
          '  <button type="submit" class="btn btn-brass btn-block" style="min-height:44px; font-weight:800;">✓ Confirm Return to Store</button>',
          '</form>'
        ].join('');

        openSheet('Return Stock: ' + record.itemName, html, function(closeSheet) {
          const form = document.getElementById('return-stock-form');
          if (form) {
            form.addEventListener('submit', function(e) {
              e.preventDefault();
              const q = Number(document.getElementById('ret-qty-input').value) || 0;
              const res = returnIssuedStock(record.id, q);
              if (res.success) {
                showToast('✓ Returned ' + res.returned + ' ' + record.unit + 's to Main Store');
                closeSheet();
                renderInventory();
              } else {
                showToast('Error: ' + res.message);
              }
            });
          }
        });
      }

      // Open Clean, Key-Details Item Sheet (with Dual Store & Bar Inventory)
      function openItemDetailsSheet(itemId) {
        const item = appState.inventory.find(function(i) { return i.id === itemId; });
        if (!item) return;

        const conv = Math.max(1, item.conversionRate || 1);
        const store = item.storeStock !== undefined ? item.storeStock : 0;
        const bar = item.barStock !== undefined ? item.barStock : item.stock;
        const totalSellUnits = Number((item.stock * conv).toFixed(2));
        const barSellUnits = Number((bar * conv).toFixed(2));
        const isLow = bar <= item.minAlert;
        const belowCost = isPriceBelowCost(item);
        const retailValue = totalSellUnits * item.sellPrice;

        let statusBadge = '<span class="status-badge status-sufficient">✓ In Stock</span>';
        if (item.stock <= 0) {
          statusBadge = '<span class="status-badge status-low" style="background:#B3432B; color:#fff;">Out of Stock</span>';
        } else if (isLow) {
          statusBadge = '<span class="status-badge status-low">⚠ Low Bar Stock</span>';
        } else if (belowCost) {
          statusBadge = '<span class="status-badge status-below-cost">⚠ Sell Below Cost</span>';
        }

        const html = [
          '<div style="padding-bottom:2px;">',
          // Category & Status
          '  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">',
          '    <span class="badge-tag" style="background:#EAE5D9; font-size:0.7rem; text-transform:uppercase; font-weight:700; color:var(--ink-2);">' + escapeHtml(item.category) + '</span>',
          '    <div>' + statusBadge + '</div>',
          '  </div>',

          // Dual Inventory Breakdown (Main Store & Bar)
          '  <div class="form-row-2 mb-2">',
          '    <div style="background:#F7F4EC; border:1px solid #E2DCCF; border-radius:6px; padding:8px 10px;">',
          '      <span style="font-size:0.68rem; color:var(--muted); display:block; font-weight:700; text-transform:uppercase;">🏬 Main Store</span>',
          '      <div class="mono" style="font-size:1.15rem; font-weight:700; color:var(--ink); margin-top:1px;">' + formatNum(store, 2) + ' <span style="font-size:0.75rem; font-weight:600; color:var(--muted);">' + escapeHtml(item.baseUnit) + (store === 1 ? '' : 's') + '</span></div>',
          '      <div style="font-size:0.7rem; color:var(--muted);">Bulk storage</div>',
          '    </div>',
          '    <div style="background:#F0F7F2; border:1px solid #C4DFC9; border-radius:6px; padding:8px 10px;">',
          '      <span style="font-size:0.68rem; color:#1E663B; display:block; font-weight:700; text-transform:uppercase;">🍸 Issued to Bar (Sale)</span>',
          '      <div class="mono" style="font-size:1.15rem; font-weight:700; color:#1E663B; margin-top:1px;">' + formatNum(bar, 2) + ' <span style="font-size:0.75rem; font-weight:600; color:#1E663B;">' + escapeHtml(item.baseUnit) + (bar === 1 ? '' : 's') + '</span></div>',
          (conv > 1 ? '      <div class="mono" style="font-size:0.72rem; color:#1E663B; font-weight:600;">≈ ' + formatNum(barSellUnits, 0) + ' ' + escapeHtml(item.sellUnit) + 's</div>' : '      <div style="font-size:0.7rem; color:#1E663B;">Ready for sale</div>'),
          '    </div>',
          '  </div>',

          // Key 1: Total Stock & Retail Selling Value
          '  <div class="form-row-2 mb-2">',
          '    <div style="background:#F7F4EC; border:1px solid var(--line); border-radius:6px; padding:8px 10px;">',
          '      <span style="font-size:0.68rem; color:var(--muted); display:block; font-weight:700; text-transform:uppercase;">Total In House</span>',
          '      <div class="mono" style="font-size:1.15rem; font-weight:700; color:var(--ink); margin-top:1px;">' + formatNum(item.stock, 2) + ' <span style="font-size:0.75rem; font-weight:600; color:var(--muted);">' + escapeHtml(item.baseUnit) + (item.stock === 1 ? '' : 's') + '</span></div>',
          (conv > 1 ? '      <div class="mono" style="font-size:0.72rem; color:var(--brass-dark); font-weight:600;">≈ ' + formatNum(totalSellUnits, 0) + ' ' + escapeHtml(item.sellUnit) + 's</div>' : ''),
          '    </div>',
          '    <div style="background:#F7F4EC; border:1px solid var(--line); border-radius:6px; padding:8px 10px;">',
          '      <span style="font-size:0.68rem; color:var(--muted); display:block; font-weight:700; text-transform:uppercase;">Selling Value</span>',
          '      <div class="mono" style="font-size:1.15rem; font-weight:700; color:var(--brass); margin-top:1px;">' + formatMWK(retailValue) + '</div>',
          '      <div style="font-size:0.7rem; color:var(--muted);">' + formatMWK(item.sellPrice) + ' / ' + escapeHtml(item.sellUnit) + '</div>',
          '    </div>',
          '  </div>',

          // Key 2: Cost & Packaging Breakdown
          '  <div style="background:#FFF; border:1px solid var(--line); border-radius:6px; padding:6px 10px; margin-bottom:12px; font-size:0.82rem;">',
          '    <div style="display:flex; justify-content:space-between; align-items:center; padding:5px 0;' + (conv > 1 ? ' border-bottom:1px solid #F0ECE1;' : '') + '">',
          '      <span style="color:var(--muted);">Buy Cost</span>',
          '      <span class="mono" style="font-weight:700;">' + formatMWK(item.buyPrice) + ' / ' + escapeHtml(item.baseUnit) + '</span>',
          '    </div>',
          (conv > 1 ? [
            '    <div style="display:flex; justify-content:space-between; align-items:center; padding:5px 0;">',
            '      <span style="color:var(--muted);">Portion Packaging</span>',
            '      <span class="mono" style="font-weight:600;">1 ' + escapeHtml(item.baseUnit) + ' = ' + conv + ' ' + escapeHtml(item.sellUnit) + 's</span>',
            '    </div>'
          ].join('') : ''),
          '  </div>',

          // Key 3: Direct Actions
          '  <div style="display:flex; flex-direction:column; gap:6px;">',
          '    <div style="display:flex; gap:6px;">',
          '      <button type="button" class="btn btn-brass btn-sm" id="sheet-btn-issue" style="flex:1; min-height:38px; font-size:0.85rem; font-weight:700;">📤 Issue to Bar for Sale</button>',
          '      <button type="button" class="btn btn-outline btn-sm" id="sheet-btn-sell" style="flex:1; min-height:38px; font-size:0.85rem; font-weight:600;">⚡ Sell at POS</button>',
          '    </div>',
          '    <div style="display:flex; gap:6px;">',
          '      <button type="button" class="btn btn-outline btn-sm" id="sheet-btn-restock" style="flex:1; min-height:34px; font-size:0.8rem;">+ Restock Store</button>',
          '      <button type="button" class="btn btn-outline btn-sm" id="sheet-btn-edit" style="min-height:34px; padding:0 14px; font-size:0.8rem;">✎ Edit</button>',
          '    </div>',
          '  </div>',
          '</div>'
        ].join('');

        openSheet(item.name, html, function(closeSheet) {
          const issueBtn = document.getElementById('sheet-btn-issue');
          if (issueBtn) {
            issueBtn.addEventListener('click', function() {
              closeSheet();
              openQuickIssueSheet(item.id);
            });
          }

          const sellBtn = document.getElementById('sheet-btn-sell');
          if (sellBtn) {
            sellBtn.addEventListener('click', function() {
              closeSheet();
              switchTab('sell');
              selectSellItem(item.id);
            });
          }

          const restockBtn = document.getElementById('sheet-btn-restock');
          if (restockBtn) {
            restockBtn.addEventListener('click', function() {
              closeSheet();
              openRestockSheet(item.id);
            });
          }

          const editBtn = document.getElementById('sheet-btn-edit');
          if (editBtn) {
            editBtn.addEventListener('click', function() {
              closeSheet();
              openItemEditor(item.id);
            });
          }
        });
      }

      // Open Add/Edit Item Sheet
      function openItemEditor(itemId) {
        const item = itemId ? appState.inventory.find(function(i) { return i.id === itemId; }) : null;
        const isEdit = !!item;

        // Default values for ADD mode:
        // stock 0, low-stock threshold 10, conversion rate 25, base unit "bottle", category prefilled to last picked category
        const defaultCategory = (appState.settings && appState.settings.lastCategory) || (appState.categories[0] || 'Beer');
        const initialCategory = item ? item.category : defaultCategory;
        const initialBaseUnit = item ? item.baseUnit : 'bottle';
        const isPortioned = item ? ((item.conversionRate && item.conversionRate > 1) || (item.sellUnit && item.sellUnit.toLowerCase() !== item.baseUnit.toLowerCase())) : false;
        const initialSellUnit = item ? item.sellUnit : (isPortioned ? 'shot' : initialBaseUnit);
        const initialConv = item ? (item.conversionRate || 1) : 25;
        const initialBuy = item ? item.buyPrice : '';
        const initialSell = item ? item.sellPrice : '';
        const initialStock = item ? item.stock : 0;
        const initialAlert = item ? item.minAlert : 10;

        // Ensure current item's category is included in dropdown options
        let allCategories = appState.categories.slice();
        if (item && item.category && !allCategories.includes(item.category)) {
          allCategories.push(item.category);
        }

        const catOptions = allCategories.map(function(c) {
          return '<option value="' + escapeHtml(c) + '"' + (initialCategory === c ? ' selected' : '') + '>' + escapeHtml(c) + '</option>';
        }).join('') + '<option value="__new__">+ Add new category</option>';

        const formHtml = [
          '<form id="item-form">',
          // 1. Item Name
          '  <div class="form-group" style="margin-bottom:12px;">',
          '    <label>Item Name *</label>',
          '    <input type="text" class="form-input" id="item-input-name" required value="' + (item ? escapeHtml(item.name) : '') + '" placeholder="e.g. Carlsberg Green 330ml" autofocus>',
          '  </div>',

          // 2. Category Dropdown & Inline New Category Field
          '  <div class="form-group" style="margin-bottom:12px;">',
          '    <label>Category *</label>',
          '    <select class="form-select" id="item-input-cat">' + catOptions + '</select>',
          '    <div id="item-new-cat-group" style="display:none; margin-top:6px;">',
          '      <input type="text" class="form-input" id="item-input-new-cat" placeholder="Enter new category name...">',
          '    </div>',
          '  </div>',

          // 3. Counted / restocked in (base unit)
          '  <div class="form-group" style="margin-bottom:12px;">',
          '    <label>Counted / restocked in (base unit) *</label>',
          '    <input type="text" class="form-input" id="item-input-base-unit" required value="' + escapeHtml(initialBaseUnit) + '" placeholder="e.g. bottle, crate, kg">',
          '    <div class="hint">This is the unit stock is tracked and reconciled in.</div>',
          '  </div>',

          // 4. Checkbox: Sold in smaller portions
          '  <div class="form-group" style="background:#FAF8F2; border:1px solid #ECE7D9; border-radius:6px; padding:10px 12px; margin-bottom:12px;">',
          '    <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:600; margin-bottom:0; font-size:0.86rem;">',
          '      <input type="checkbox" id="item-check-portion" ' + (isPortioned ? 'checked' : '') + ' style="width:17px; height:17px; accent-color:var(--brass-dark); cursor:pointer;">',
          '      <span>Sold in smaller portions <span style="font-weight:400; color:var(--muted); font-size:0.78rem;">(e.g. shots from a bottle, plates from a sack)</span></span>',
          '    </label>',
          '    <div id="item-portion-fields" style="display:' + (isPortioned ? 'block' : 'none') + '; margin-top:10px; padding-top:10px; border-top:1px solid #ECE7D9;">',
          '      <div class="form-row-2">',
          '        <div class="form-group" style="margin-bottom:0;">',
          '          <label>Sold in (sell unit) *</label>',
          '          <input type="text" class="form-input" id="item-input-sell-unit" value="' + escapeHtml(initialSellUnit) + '" placeholder="e.g. shot, glass">',
          '        </div>',
          '        <div class="form-group" style="margin-bottom:0;">',
          '          <label>How many per <span id="label-conv-base">' + escapeHtml(initialBaseUnit) + '</span>? *</label>',
          '          <input type="number" step="any" min="1" class="form-input mono" id="item-input-conv" value="' + initialConv + '">',
          '          <div style="display:flex; gap:4px; margin-top:4px;">',
          '            <button type="button" class="btn btn-outline btn-sm conv-pick-btn" data-val="25" style="flex:1; min-height:26px; padding:0; font-size:0.75rem; font-weight:600;">25</button>',
          '            <button type="button" class="btn btn-outline btn-sm conv-pick-btn" data-val="30" style="flex:1; min-height:26px; padding:0; font-size:0.75rem; font-weight:600;">30</button>',
          '            <button type="button" class="btn btn-outline btn-sm conv-pick-btn" data-val="24" style="flex:1; min-height:26px; padding:0; font-size:0.75rem; font-weight:600;">24</button>',
          '          </div>',
          '        </div>',
          '      </div>',
          '    </div>',
          '  </div>',

          // 5. Pricing & Live Preview Line
          '  <div class="form-row-2" style="margin-bottom:6px;">',
          '    <div class="form-group" style="margin-bottom:0;">',
          '      <label>Cost / <span id="label-buy-unit">' + escapeHtml(initialBaseUnit) + '</span> (MWK) *</label>',
          '      <input type="number" step="any" min="0" class="form-input mono" id="item-input-buy" required value="' + initialBuy + '" placeholder="0.00">',
          '    </div>',
          '    <div class="form-group" style="margin-bottom:0;">',
          '      <label>Sell Price / <span id="label-sell-unit">' + escapeHtml(isPortioned ? initialSellUnit : initialBaseUnit) + '</span> (MWK) *</label>',
          '      <input type="number" step="any" min="0" class="form-input mono" id="item-input-sell" required value="' + initialSell + '" placeholder="0.00">',
          '    </div>',
          '  </div>',
          '  <div id="item-pricing-preview" style="border-radius:6px; padding:8px 10px; margin-bottom:12px; font-size:0.8rem; transition:background-color 0.15s ease;"></div>',

          // 6. Stock on hand (in base units) with quick-adjust buttons (-1 / +1 / +6 / +24)
          '  <div class="form-group" style="margin-bottom:12px;">',
          '    <label>Stock on Hand (in <span id="label-stock-unit">' + escapeHtml(initialBaseUnit) + '</span>s) *</label>',
          '    <input type="number" step="any" min="0" class="form-input mono" id="item-input-stock" required value="' + initialStock + '" style="min-height:38px; font-size:1rem; font-weight:700;">',
          '    <div style="display:flex; gap:6px; margin-top:6px;">',
          '      <button type="button" class="btn btn-outline btn-sm stock-adj-btn" data-adj="-1" style="flex:1; min-height:30px; font-weight:700; font-size:0.8rem;">-1</button>',
          '      <button type="button" class="btn btn-outline btn-sm stock-adj-btn" data-adj="1" style="flex:1; min-height:30px; font-weight:700; font-size:0.8rem;">+1</button>',
          '      <button type="button" class="btn btn-outline btn-sm stock-adj-btn" data-adj="6" style="flex:1; min-height:30px; font-weight:700; font-size:0.8rem;">+6</button>',
          '      <button type="button" class="btn btn-outline btn-sm stock-adj-btn" data-adj="24" style="flex:1; min-height:30px; font-weight:700; font-size:0.8rem;">+24</button>',
          '    </div>',
          '  </div>',

          // 7. Low stock warning threshold, expressed in SELL units
          '  <div class="form-group" style="margin-bottom:16px;">',
          '    <label>Low stock warning threshold (in <span id="label-alert-unit">' + escapeHtml(isPortioned ? initialSellUnit : initialBaseUnit) + '</span>s) *</label>',
          '    <input type="number" step="any" min="0" class="form-input mono" id="item-input-alert" required value="' + initialAlert + '" style="min-height:38px;">',
          '    <div class="hint">Alert triggered when stock falls to or below this amount of sell units.</div>',
          '  </div>',

          // Actions: Save item & (in edit mode) Remove item
          '  <div style="display:flex; gap:10px; margin-top:12px;">',
          (isEdit ? '    <button type="button" class="btn btn-outline btn-danger" id="btn-delete-item" style="color:var(--danger); border-color:var(--danger); min-height:42px; font-size:0.86rem; padding:0 14px; white-space:nowrap; font-weight:600;">Remove item</button>' : ''),
          '    <button type="submit" class="btn btn-brass" id="btn-submit-item" style="flex:1; min-height:42px; font-weight:700; font-size:0.92rem;">Save item</button>',
          '  </div>',
          '</form>'
        ].join('');

        openSheet(isEdit ? 'Edit item' : 'Add Item', formHtml, function(closeSheet) {
          const form = document.getElementById('item-form');
          const nameInput = document.getElementById('item-input-name');
          const catSelect = document.getElementById('item-input-cat');
          const newCatGroup = document.getElementById('item-new-cat-group');
          const newCatInput = document.getElementById('item-input-new-cat');
          const baseUnitInput = document.getElementById('item-input-base-unit');
          const portionCheck = document.getElementById('item-check-portion');
          const portionFields = document.getElementById('item-portion-fields');
          const sellUnitInput = document.getElementById('item-input-sell-unit');
          const convInput = document.getElementById('item-input-conv');
          const buyInput = document.getElementById('item-input-buy');
          const sellInput = document.getElementById('item-input-sell');
          const stockInput = document.getElementById('item-input-stock');
          const alertInput = document.getElementById('item-input-alert');
          const pricingPreview = document.getElementById('item-pricing-preview');

          // Labels that dynamically update
          const labelConvBase = document.getElementById('label-conv-base');
          const labelBuyUnit = document.getElementById('label-buy-unit');
          const labelSellUnit = document.getElementById('label-sell-unit');
          const labelStockUnit = document.getElementById('label-stock-unit');
          const labelAlertUnit = document.getElementById('label-alert-unit');

          // Category change listener
          catSelect.addEventListener('change', function() {
            if (this.value === '__new__') {
              newCatGroup.style.display = 'block';
              if (newCatInput) newCatInput.focus();
            } else {
              newCatGroup.style.display = 'none';
            }
          });

          // Helper to get effective units
          function getEffectiveUnits() {
            const base = baseUnitInput.value.trim() || 'bottle';
            const isPortion = portionCheck.checked;
            let sell = base;
            let conv = 1;

            if (isPortion) {
              sell = sellUnitInput.value.trim() || 'shot';
              if (sell.toLowerCase() === base.toLowerCase()) {
                sell = 'shot'; // silently default to "shot" rather than letting them create a 1:1 "portion"
              }
              conv = Math.max(1, Number(convInput.value) || 25);
            }
            return { base: base, sell: sell, conv: conv, isPortion: isPortion };
          }

          // Live pricing preview & labels updater
          function updateFormDynamicPreview() {
            const u = getEffectiveUnits();

            // Update dynamic text labels
            if (labelConvBase) labelConvBase.textContent = u.base;
            if (labelBuyUnit) labelBuyUnit.textContent = u.base;
            if (labelSellUnit) labelSellUnit.textContent = u.sell;
            if (labelStockUnit) labelStockUnit.textContent = u.base;
            if (labelAlertUnit) labelAlertUnit.textContent = u.sell;

            // Recalculate pricing preview
            const buy = Number(buyInput.value) || 0;
            const sell = Number(sellInput.value) || 0;
            const costPerSellUnit = buy / u.conv;
            const profitPerSellUnit = sell - costPerSellUnit;
            const marginPct = sell > 0 ? ((profitPerSellUnit / sell) * 100) : 0;
            const isBelowCost = sell < costPerSellUnit && (sell > 0 || buy > 0);

            if (!pricingPreview) return;

            if (buy === 0 && sell === 0) {
              pricingPreview.style.background = '#F7F4EC';
              pricingPreview.style.border = '1px solid #ECE7D9';
              pricingPreview.style.color = 'var(--muted)';
              pricingPreview.innerHTML = '<span style="font-size:0.75rem;">Enter cost & selling price above to see live unit profit and margin preview.</span>';
              return;
            }

            const sign = profitPerSellUnit >= 0 ? '+' : '';
            const marginStr = marginPct.toFixed(1) + '%';

            if (isBelowCost) {
              pricingPreview.style.background = '#FDE8E8';
              pricingPreview.style.border = '1px solid #F8B4B4';
              pricingPreview.style.color = 'var(--danger)';
              pricingPreview.innerHTML = [
                '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:4px; font-weight:700;">',
                '  <span>⚠ Selling below cost!</span>',
                '  <span class="mono">Margin: ' + marginStr + '</span>',
                '</div>',
                '<div class="mono" style="font-size:0.75rem; margin-top:3px;">',
                '  Cost: <strong>' + formatMWK(costPerSellUnit) + '</strong> / ' + u.sell + ' · Loss: <strong>' + formatMWK(Math.abs(profitPerSellUnit)) + '</strong> / ' + u.sell,
                '</div>'
              ].join('');
            } else {
              pricingPreview.style.background = '#F7F4EC';
              pricingPreview.style.border = '1px solid #ECE7D9';
              pricingPreview.style.color = 'var(--ink)';
              pricingPreview.innerHTML = [
                '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:4px;">',
                '  <span>Cost: <strong class="mono">' + formatMWK(costPerSellUnit) + '</strong> / ' + u.sell + '</span>',
                '  <span>Profit: <strong class="mono text-good">' + sign + formatMWK(profitPerSellUnit) + '</strong> / ' + u.sell + '</span>',
                '  <span>Margin: <strong class="mono" style="color:var(--brass-dark); font-weight:700;">' + marginStr + '</strong></span>',
                '</div>'
              ].join('');
            }
          }

          // Portion checkbox toggle
          portionCheck.addEventListener('change', function() {
            if (this.checked) {
              portionFields.style.display = 'block';
              const curBase = baseUnitInput.value.trim() || 'bottle';
              const curSell = sellUnitInput.value.trim();
              if (!curSell || curSell.toLowerCase() === curBase.toLowerCase()) {
                sellUnitInput.value = 'shot';
              }
              if (!convInput.value || Number(convInput.value) <= 1) {
                convInput.value = '25';
              }
            } else {
              portionFields.style.display = 'none';
            }
            updateFormDynamicPreview();
          });

          // Conversion quick-pick buttons (25, 30, 24)
          portionFields.querySelectorAll('.conv-pick-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
              convInput.value = this.getAttribute('data-val');
              updateFormDynamicPreview();
            });
          });

          // Stock quick-adjust buttons (-1, +1, +6, +24)
          form.querySelectorAll('.stock-adj-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
              const delta = Number(this.getAttribute('data-adj')) || 0;
              const cur = Number(stockInput.value) || 0;
              stockInput.value = Math.max(0, Number((cur + delta).toFixed(4)));
            });
          });

          // Keystroke listeners for live preview line
          buyInput.addEventListener('input', updateFormDynamicPreview);
          sellInput.addEventListener('input', updateFormDynamicPreview);
          convInput.addEventListener('input', updateFormDynamicPreview);
          baseUnitInput.addEventListener('input', updateFormDynamicPreview);
          sellUnitInput.addEventListener('input', updateFormDynamicPreview);

          // Initial preview call
          updateFormDynamicPreview();

          // Form Submit
          form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = nameInput.value.trim();
            if (!name) {
              showToast('Please enter an item name');
              nameInput.focus();
              return;
            }

            // Category resolution
            let category = catSelect.value;
            if (category === '__new__') {
              const newCat = newCatInput ? newCatInput.value.trim() : '';
              if (!newCat) {
                showToast('Please enter the new category name');
                if (newCatInput) newCatInput.focus();
                return;
              }
              category = newCat;

              // Push into category list so it is available next time
              const exists = appState.categories.some(function(c) {
                return c.toLowerCase() === newCat.toLowerCase();
              });
              if (!exists) {
                appState.categories.push(newCat);
              }
            }

            // Save last picked category for next time
            if (!appState.settings) appState.settings = {};
            appState.settings.lastCategory = category;

            const baseUnit = baseUnitInput.value.trim() || 'bottle';
            const isPortion = portionCheck.checked;
            let sellUnit = baseUnit;
            let conv = 1;

            if (isPortion) {
              sellUnit = sellUnitInput.value.trim() || 'shot';
              if (sellUnit.toLowerCase() === baseUnit.toLowerCase()) {
                sellUnit = 'shot'; // silently default to "shot" rather than letting them create a 1:1 "portion"
              }
              conv = Math.max(1, Number(convInput.value) || 25);
            }

            const buy = Number(buyInput.value) || 0;
            const sell = Number(sellInput.value) || 0;
            const stock = Math.max(0, Number(stockInput.value) || 0);
            const alert = Math.max(0, Number(alertInput.value) || 0);

            // Warning confirm dialog: if selling price < cost per sell unit
            const costPerSellUnit = buy / conv;
            if (sell < costPerSellUnit && sell > 0) {
              const proceed = await askConfirm({
                title: 'Selling Below Cost',
                message: 'Selling price (' + formatMWK(sell) + ') is below the computed cost per sell unit (' + formatMWK(costPerSellUnit) + '). Save anyway?',
                okText: 'Save anyway',
                cancelText: 'Go back',
                tone: 'danger'
              });
              if (!proceed) return;
            }

            if (isEdit) {
              // EDIT MODE
              const prevStock = item.stock;
              item.name = name;
              item.category = category;
              item.baseUnit = baseUnit;
              item.sellUnit = sellUnit;
              item.conversionRate = conv;
              item.buyPrice = buy;
              item.sellPrice = sell;
              item.minAlert = alert;

              if (stock !== prevStock) {
                const diff = Number((stock - prevStock).toFixed(4));
                applyManualStockChange(item.id, diff, 'Stock count adjustment during edit');
              } else {
                schedulePersist();
              }

              showToast('Item updated');
              closeSheet();
              renderInventory();
            } else {
              // ADD MODE
              // Duplicate name check (case-insensitive exact match)
              const dup = appState.inventory.find(function(i) {
                return i.name.trim().toLowerCase() === name.toLowerCase();
              });

              if (dup) {
                const choice = await askDuplicateOption(dup, stock, baseUnit);
                if (choice === 'cancel') {
                  return; // Don't submit, keep form open for correction
                }
                if (choice === 'add-existing') {
                  if (stock > 0) {
                    applyManualStockChange(dup.id, stock, 'Restock from duplicate entry', 'Inventory Entry');
                    showToast('Added ' + formatNum(stock, 2) + ' ' + dup.baseUnit + (stock === 1 ? '' : 's') + ' to ' + dup.name);
                  } else {
                    showToast('Item already exists: ' + dup.name);
                  }
                  closeSheet();
                  renderInventory();
                  return;
                }
                // choice === 'create-separate': proceed to create separate item
              }

              const newId = uuid();
              const newItem = {
                id: newId,
                name: name,
                category: category,
                baseUnit: baseUnit,
                sellUnit: sellUnit,
                conversionRate: conv,
                buyPrice: buy,
                sellPrice: sell,
                storeStock: stock,
                barStock: 0,
                stock: stock,
                minAlert: alert
              };

              appState.inventory.push(newItem);
              ensureDayShape(appState.currentDay);
              appState.currentDay.opening[newId] = stock;

              if (stock > 0) {
                appState.stockMoves.push({
                  id: uuid(),
                  itemId: newId,
                  qty: stock,
                  unitCost: buy,
                  supplier: 'Initial Inventory Entry',
                  date: getTodayStr(),
                  time: getTimeStr(),
                  dayId: appState.currentDay.date,
                  baseUnit: baseUnit
                });
              }

              schedulePersist();
              showToast('Item added');
              closeSheet();
              renderInventory();
            }
          });

          // Delete / Remove Item in Edit Mode
          if (isEdit) {
            const btnDel = document.getElementById('btn-delete-item');
            if (btnDel) {
              btnDel.addEventListener('click', function() {
                askConfirm({
                  title: 'Remove ' + item.name + '?',
                  message: 'This will remove the item from your inventory and reconciliation.',
                  okText: 'Remove item',
                  tone: 'danger'
                }).then(function(confirmed) {
                  if (confirmed) {
                    appState.inventory = appState.inventory.filter(function(i) { return i.id !== item.id; });
                    ensureDayShape(appState.currentDay);
                    schedulePersist();
                    showToast('Item removed');
                    closeSheet();
                    renderInventory();
                  }
                });
              });
            }
          }
        });
      }

      // Restock Sheet
      function openRestockSheet(itemId) {
        const item = appState.inventory.find(function(i) { return i.id === itemId; });
        if (!item) return;

        const store = item.storeStock !== undefined ? item.storeStock : 0;
        const bar = item.barStock !== undefined ? item.barStock : item.stock;

        const html = [
          '<form id="restock-form">',
          '  <div style="background:#F4EFE3; padding:10px 12px; border-radius:6px; margin-bottom:12px; border:1px solid var(--line);">',
          '    <strong style="font-size:1rem; color:var(--ink);">' + escapeHtml(item.name) + '</strong>',
          '    <div style="display:flex; gap:12px; margin-top:4px; font-size:0.8rem;">',
          '      <span>🏬 Store: <strong class="mono">' + formatNum(store, 2) + '</strong></span>',
          '      <span>🍸 Bar Floor: <strong class="mono">' + formatNum(bar, 2) + '</strong></span>',
          '      <span>Total: <strong class="mono">' + formatNum(item.stock, 2) + '</strong> ' + escapeHtml(item.baseUnit) + (item.stock === 1 ? '' : 's') + '</span>',
          '    </div>',
          '  </div>',
          '  <div class="form-group" style="margin-bottom:12px;">',
          '    <label style="font-weight:700;">Restock Destination *</label>',
          '    <select class="form-select" id="restock-location" style="min-height:38px;">',
          '      <option value="store" selected>🏬 Main Store (Bulk Storeroom — Recommended)</option>',
          '      <option value="bar">🍸 Direct to Bar Floor (Immediate Sale)</option>',
          '    </select>',
          '  </div>',
          '  <div class="form-group">',
          '    <label>Quantity to Add (' + escapeHtml(item.baseUnit) + 's) *</label>',
          '    <input type="number" step="any" min="0.01" class="form-input mono" id="restock-qty" required placeholder="e.g. 24" autofocus>',
          '    <div class="pill-grid">',
          '      <button type="button" class="pill-btn" data-add="6">+6</button>',
          '      <button type="button" class="pill-btn" data-add="12">+12</button>',
          '      <button type="button" class="pill-btn" data-add="24">+24</button>',
          '    </div>',
          '  </div>',
          '  <div class="form-row-2">',
          '    <div class="form-group">',
          '      <label>Cost / ' + escapeHtml(item.baseUnit) + ' (MWK)</label>',
          '      <input type="number" step="any" class="form-input mono" id="restock-cost" value="' + item.buyPrice + '">',
          '    </div>',
          '    <div class="form-group">',
          '      <label>Supplier / Invoice Ref</label>',
          '      <input type="text" class="form-input" id="restock-supplier" placeholder="e.g. Castel / Metro">',
          '    </div>',
          '  </div>',
          '  <button type="submit" class="btn btn-brass btn-block mt-3">+ Confirm Restock</button>',
          '</form>'
        ].join('');

        openSheet('Restock: ' + item.name, html, function(closeSheet) {
          const qtyInput = document.getElementById('restock-qty');
          document.querySelectorAll('.pill-btn[data-add]').forEach(function(btn) {
            btn.addEventListener('click', function() {
              const current = Number(qtyInput.value) || 0;
              qtyInput.value = current + Number(this.getAttribute('data-add'));
            });
          });

          document.getElementById('restock-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const qty = Number(qtyInput.value);
            const cost = Number(document.getElementById('restock-cost').value) || item.buyPrice;
            const supplier = document.getElementById('restock-supplier').value.trim() || 'Vendor Restock';
            const targetLoc = document.getElementById('restock-location') ? document.getElementById('restock-location').value : 'store';

            if (qty > 0) {
              applyManualStockChange(item.id, qty, 'Restock', supplier, cost, targetLoc);
              showToast('Restocked ' + qty + ' ' + item.baseUnit + 's to ' + (targetLoc === 'bar' ? 'Bar Floor' : 'Main Store'));
              closeSheet();
              renderInventory();
            }
          });
        });
      }

      // --- Screen 2: Sell (Segmented High-Efficiency POS Register) ---
      let sellViewMode = 'register'; // 'register' (Ring Up Sale) or 'receipts' (Today's Sales & Receipts)
      let sellSelectedItemId = null;
      let sellUnitMode = null; // unselected initially for zero-error safeguards if item has portions
      let sellQty = 1;
      let sellCustomPrice = null;
      let sellShowCustomPrice = false;
      let sellLastStaff = '';
      let sellPaymentMethod = null; // unselected initially for zero-error safeguards
      let sellProductSearch = '';
      let sellActiveCategory = 'All';
      let lastSaleLogged = null;

      function renderSell() {
        const container = document.getElementById('view-sell');
        if (!container) return;

        // Currently selected item for Sell POS
        const selectedItem = sellSelectedItemId ? appState.inventory.find(function(i) { return i.id === sellSelectedItemId; }) : null;

        // Remembered staff
        if (!sellLastStaff && appState.staffList.length > 0) {
          sellLastStaff = appState.staffList[0];
        }

        // Today's sales metrics & records
        const todaySales = appState.salesLog.filter(function(s) {
          return s.date === appState.currentDay.date;
        }).slice().reverse();

        let todayRevenue = 0;
        let todayCogs = 0;
        const payBreakdown = {};
        todaySales.forEach(function(s) {
          if (!s.voided) {
            todayRevenue += s.total;
            const conv = s.convSnap || 1;
            const baseQty = s.unitType === 'sell' ? (s.qty / conv) : s.qty;
            todayCogs += baseQty * (s.costSnap || 0);
            payBreakdown[s.payment] = (payBreakdown[s.payment] || 0) + s.total;
          }
        });
        const todayProfit = todayRevenue - todayCogs;
        const activeSalesCount = todaySales.filter(function(s){ return !s.voided; }).length;
        const avgSale = activeSalesCount > 0 ? (todayRevenue / activeSalesCount) : 0;

        let html = [];

        // 1. SEGMENTED POS NAVIGATION TOGGLE
        html.push([
          '<div class="pos-segmented-nav">',
          '  <button type="button" class="pos-segmented-btn ' + (sellViewMode === 'register' ? 'active' : '') + '" id="btn-pos-nav-register">',
          '    <span>⚡</span> <span>Ring Up Sale</span>',
          '  </button>',
          '  <button type="button" class="pos-segmented-btn ' + (sellViewMode === 'receipts' ? 'active' : '') + '" id="btn-pos-nav-receipts">',

        // Submit Sale handler
        const submitBtn = document.getElementById('btn-submit-sale');
        if (submitBtn && sellSelectedItemId) {
          const selectedItem = appState.inventory.find(function(i) { return i.id === sellSelectedItemId; });
          submitBtn.addEventListener('click', function() {
            if (!selectedItem) return;

            const staff = (document.getElementById('sell-staff-input').value || 'Staff').trim();
            sellLastStaff = staff;
            if (!appState.staffList.includes(staff) && staff) {
              appState.staffList.push(staff);
            }

            let defaultUnitPrice = 0;
            let unitLabel = '';
            let availableSellQty = 0;
            let qtyInBaseUnits = 0;

            if (sellUnitMode === 'sell') {
              defaultUnitPrice = selectedItem.sellPrice;
              unitLabel = selectedItem.sellUnit;
              availableSellQty = selectedItem.stock * (selectedItem.conversionRate || 1);
              qtyInBaseUnits = sellQty / (selectedItem.conversionRate || 1);
            } else {
              defaultUnitPrice = selectedItem.sellPrice * (selectedItem.conversionRate || 1);
              unitLabel = selectedItem.baseUnit;
              availableSellQty = selectedItem.stock;
              qtyInBaseUnits = sellQty;
            }

            const effectiveUnitPrice = (sellCustomPrice !== null) ? sellCustomPrice : defaultUnitPrice;
            const totalAmount = Number((sellQty * effectiveUnitPrice).toFixed(2));
            const stockAfterSale = Number((selectedItem.stock - qtyInBaseUnits).toFixed(2));
            const isStockDeficit = stockAfterSale < 0;

            // Warnings Check
            let checkWarnings = Promise.resolve(true);

            // 1. Stock deficit warning
            if (isStockDeficit) {
              checkWarnings = checkWarnings.then(function(ok) {
                if (!ok) return false;
                return askConfirm({
                  title: 'Low Stock Warning',
                  message: 'This sale of ' + sellQty + ' ' + unitLabel + ' exceeds current stock (' + availableSellQty + '). Remaining stock will be negative (' + stockAfterSale + ' ' + selectedItem.baseUnit + '). Proceed anyway?',
                  okText: 'Sell Anyway',
                  tone: 'danger'
                });
              });
            }

            // 2. Below cost warning
            const costOfUnitSold = sellUnitMode === 'sell'
              ? (selectedItem.buyPrice / (selectedItem.conversionRate || 1))
              : selectedItem.buyPrice;

            if (effectiveUnitPrice < costOfUnitSold) {
              checkWarnings = checkWarnings.then(function(ok) {
                if (!ok) return false;
                return askConfirm({
                  title: 'Priced Below Cost',
                  message: 'Sale price (' + formatMWK(effectiveUnitPrice) + ') is BELOW unit buy cost (' + formatMWK(costOfUnitSold) + '). Margin is negative. Proceed anyway?',
                  okText: 'Proceed Below Cost',
                  tone: 'danger'
                });
              });
            }

            checkWarnings.then(function(canProceed) {
              if (!canProceed) return;

              // Record sale with all snapshots
              const saleRecord = {
                id: uuid(),
                itemId: selectedItem.id,
                itemName: selectedItem.name,
                qty: sellQty,
                unitType: sellUnitMode,
                priceEach: effectiveUnitPrice,
                total: totalAmount,
                staff: staff,
                payment: sellPaymentMethod,
                date: appState.currentDay.date,
                dayId: appState.currentDay.date,
                time: getTimeStr(),
                costSnap: selectedItem.buyPrice,
                convSnap: selectedItem.conversionRate || 1,
                unitLabelSnap: unitLabel,
                baseUnitSnap: selectedItem.baseUnit,
                sellUnitSnap: selectedItem.sellUnit,
                voided: false
              };

              appState.salesLog.push(saleRecord);

              // Decrement item inventory stock directly from Bar Floor (base units)
              if (selectedItem.barStock !== undefined) {
                selectedItem.barStock = Math.max(0, Number(((selectedItem.barStock || 0) - qtyInBaseUnits).toFixed(4)));
              }
              selectedItem.stock = Math.max(0, Number(((selectedItem.storeStock || 0) + (selectedItem.barStock !== undefined ? selectedItem.barStock : Math.max(0, selectedItem.stock - qtyInBaseUnits))).toFixed(4)));

              schedulePersist();
              showToast('Sale logged (' + sellPaymentMethod + '): ' + formatMWK(totalAmount));

              // Store last logged sale for instant turnaround bar
              lastSaleLogged = saleRecord;

              // Reset form ready for next sale
              sellQty = 1;
              sellCustomPrice = null;
              sellShowCustomPrice = false;
              sellSelectedItemId = null;
              sellUnitMode = null;
              sellPaymentMethod = null;
              renderSell();
            });
          });

      function openSaleEditor(saleId) {
        const sale = appState.salesLog.find(function(s) { return s.id === saleId; });
        if (!sale || sale.voided) return;

        const html = [
          '<div style="background:#F9F7F1; padding:10px; border-radius:4px; margin-bottom:12px; border:1px solid var(--line); font-size:0.85rem;">',

          '</div>',
          '<div class="form-group">',
          '  <label>Quantity (' + sale.unitLabelSnap + ')</label>',
          '  <input type="number" step="any" min="0.1" class="form-input mono" id="edit-sale-qty" value="' + sale.qty + '">',
          '</div>',
          '<div class="form-group">',
          '  <label>Price Each (MWK)</label>',

          '    <option value="Bank Transfer"' + (sale.payment === 'Bank Transfer' ? ' selected' : '') + '>Bank Transfer</option>',
          '    <option value="Airtel Money"' + (sale.payment === 'Airtel Money' ? ' selected' : '') + '>Airtel Money</option>',
          '    <option value="TNM Mpamba"' + (sale.payment === 'TNM Mpamba' ? ' selected' : '') + '>TNM Mpamba</option>',
          '    <option value="Other"' + (sale.payment === 'Other' ? ' selected' : '') + '>Other</option>',
          '  </select>',
          '</div>',
          '<div style="display:flex; gap:8px; margin-top:16px;">',
          '  <button type="button" class="btn btn-outline btn-danger" id="btn-void-sale" style="color:var(--danger); border-color:var(--danger);">Void Transaction</button>',
          '  <button type="button" class="btn btn-brass" id="btn-save-sale" style="flex:1;">Save Edits</button>',
          '</div>'
        ].join('');

        openSheet('Edit Sale Record', html, function(closeSheet) {
          document.getElementById('btn-save-sale').addEventListener('click', function() {
            const newQty = Number(document.getElementById('edit-sale-qty').value) || sale.qty;
            const newPrice = Number(document.getElementById('edit-sale-price').value) || sale.priceEach;
            const newStaff = document.getElementById('edit-sale-staff').value.trim() || sale.staff;
            const newPay = document.getElementById('edit-sale-pay').value;

            // If qty changed and sale is on current open day, adjust stock
            const isToday = sale.date === appState.currentDay.date;
            if (newQty !== sale.qty) {
              const conv = sale.convSnap || 1;
              const deltaQty = newQty - sale.qty;
              const deltaBase = sale.unitType === 'sell' ? (deltaQty / conv) : deltaQty;
              const item = appState.inventory.find(function(i) { return i.id === sale.itemId; });
              if (item) {
                // If quantity increased, we reduce bar floor; if reduced, we return to bar floor
                if (item.barStock !== undefined) {
                  item.barStock = Math.max(0, Number(((item.barStock || 0) - deltaBase).toFixed(4)));
                }
                item.stock = Math.max(0, Number(((item.storeStock || 0) + (item.barStock !== undefined ? item.barStock : Math.max(0, item.stock - deltaBase))).toFixed(4)));
              }
            }

            sale.qty = newQty;
            sale.priceEach = newPrice;
            sale.total = Number((newQty * newPrice).toFixed(2));
            sale.staff = newStaff;
            sale.payment = newPay;
            sale.editedAt = new Date().toISOString();

            schedulePersist();
            showToast('Sale updated');
            closeSheet();
            renderSell();
            if (activeTab === 'sales-log') renderSalesLog();
            if (activeTab === 'reconcile') renderReconcile();

              okText: 'Void Sale',
              tone: 'danger'
            }).then(function(confirmed) {
              if (confirmed) {
                sale.voided = true;
                sale.voidedAt = new Date().toISOString();

                // Return stock to inventory
                const conv = sale.convSnap || 1;
                const baseQty = sale.unitType === 'sell' ? (sale.qty / conv) : sale.qty;
                const item = appState.inventory.find(function(i) { return i.id === sale.itemId; });

                  item.stock = Number(((item.storeStock || 0) + (item.barStock !== undefined ? item.barStock : (item.stock + baseQty))).toFixed(4));
                }

                schedulePersist();
                showToast('Sale voided');
                closeSheet();
                renderSell();
                if (activeTab === 'sales-log') renderSalesLog();
                if (activeTab === 'reconcile') renderReconcile();
              }
            });
          });
        });
      }

      // --- Screen 3: Sales Log ---
      let logSelectedDate = getTodayStr();

      function getAnalyticsForPeriod(daysCount) {
        const now = new Date();
        const cutoff = new Date();
        cutoff.setDate(now.getDate() - (daysCount - 1));
        const cutoffStr = cutoff.toISOString().slice(0, 10);

        let rev = 0;
        let cogs = 0;
        let count = 0;

        appState.salesLog.forEach(function(s) {
          if (!s.voided && s.date >= cutoffStr) {
            rev += s.total;
            const conv = s.convSnap || 1;
            const baseQty = s.unitType === 'sell' ? (s.qty / conv) : s.qty;
            cogs += baseQty * (s.costSnap || 0);
            count++;
          }
        });

        const profit = rev - cogs;
        return { rev: rev, cogs: cogs, profit: profit, count: count };
      }

      function renderSalesLog() {
        const container = document.getElementById('view-sales-log');
        if (!container) return;

        const aToday = getAnalyticsForPeriod(1);
        const a7Days = getAnalyticsForPeriod(7);
        const a30Days = getAnalyticsForPeriod(30);

        // Sales for the selected date
        const daySales = appState.salesLog.filter(function(s) {
          return s.date === logSelectedDate;
        }).slice().reverse();

        let dayRev = 0;
        let dayCogs = 0;
        const itemTotals = {};
        const payBreakdown = {};

            dayRev += s.total;
            const conv = s.convSnap || 1;
            const baseQty = s.unitType === 'sell' ? (s.qty / conv) : s.qty;
            dayCogs += baseQty * (s.costSnap || 0);

            itemTotals[s.itemName] = (itemTotals[s.itemName] || 0) + s.qty;
            payBreakdown[s.payment] = (payBreakdown[s.payment] || 0) + s.total;
