          '    </div>',
          '    <div>',
          '      <span style="font-size:0.7rem; color:var(--muted); display:block;">COGS</span>',
          '      <span class="mono" style="font-weight:600; font-size:0.9rem; color:var(--danger);">' + formatMWK(dayCogs) + '</span>',
          '    </div>',
          '    <div>',
          '      <span style="font-size:0.7rem; color:var(--muted); display:block;">Gross Profit</span>',
          '      <span class="mono" style="font-weight:700; font-size:1rem; color:var(--good);">' + formatMWK(dayProfit) + '</span>',
          '    </div>',
          '  </div>',
          '  <div style="margin-top:8px; font-size:0.8rem;">',
          '    <strong>Top Seller:</strong> ' + topSellerName + (topSellerQty > 0 ? ' (' + topSellerQty + ' units)' : '') + '<br>',
          '    <div style="margin-top:6px;">' + payPills + '</div>',
          '  </div>',
          '</div>',

          // Transaction Table
          '<div class="card">',
          '  <h3 style="font-size:1rem; font-weight:700; margin-bottom:8px;">Transactions on ' + logSelectedDate + ' (' + daySales.length + ')</h3>'
        ];

        if (daySales.length === 0) {
          html.push('<div style="text-align:center; padding:20px; color:var(--muted); font-size:0.85rem;">No transactions recorded for this date.</div>');
        } else {
          html.push('<div style="overflow-x:auto;"><table class="dense-table">');
          html.push('<thead><tr><th>Time</th><th>Item</th><th>Staff</th><th>Payment</th><th>Qty</th><th>Total</th><th></th></tr></thead><tbody>');
          daySales.forEach(function(s) {
            const isVoid = s.voided;
            html.push([
              '<tr style="' + (isVoid ? 'opacity:0.4; text-decoration:line-through;' : '') + '">',
              '  <td class="mono">' + s.time + '</td>',
              '  <td><strong>' + s.itemName + '</strong>' + (isVoid ? ' <span class="badge-tag badge-stale">VOID</span>' : '') + '</td>',
              '  <td>' + s.staff + '</td>',
              '  <td>' + s.payment + '</td>',
              '  <td class="mono">' + s.qty + ' ' + s.unitLabelSnap + '</td>',
              '  <td class="mono">' + formatMWK(s.total) + '</td>',
              '  <td class="text-right">',
              (!isVoid ? '<button class="btn btn-outline btn-sm btn-edit-log-sale" data-id="' + s.id + '" style="min-height:28px; padding:0 6px; font-size:0.75rem;">Edit</button>' : ''),
              '  </td>',
              '</tr>'
            ].join(''));
          });
          html.push('</tbody></table></div>');
        }
        html.push('</div>'); // end card

        container.innerHTML = html.join('');

        // Event listeners
        const datePicker = document.getElementById('log-date-picker');
        datePicker.addEventListener('change', function() {
          logSelectedDate = this.value;
          renderSalesLog();
        });

        document.getElementById('btn-date-today').addEventListener('click', function() {
          logSelectedDate = getTodayStr();
          renderSalesLog();
        });

        document.getElementById('btn-export-sales-csv').addEventListener('click', function() {
          exportSalesCSV();
        });

        container.querySelectorAll('.btn-edit-log-sale').forEach(function(btn) {
          btn.addEventListener('click', function() {
            openSaleEditor(this.getAttribute('data-id'));
          });
        });
      }

      // --- Screen 4: Reconcile ---
      let reconFilter = 'pending'; // 'pending' | 'reconciled' | 'summary' | 'all'
      let reconSearchQuery = '';
      let reconCategoryFilter = 'all';
      let reconEditingCards = {}; // itemId: boolean

      // Modal helper to cleanly adjust sold quantities or reset to POS log
      function openEditSoldModal(itemId) {
        const item = appState.inventory.find(function(i) { return i.id === itemId; });
        if (!item) return;

        const cd = appState.currentDay;
        const logSold = getSalesLogBaseUnits(itemId, cd.date);
        const currentSold = getReconcileSoldBaseUnits(itemId);
        const isOverridden = (cd.manualSold && cd.manualSold[itemId] !== undefined && cd.manualSold[itemId] !== null);
        const prefUnit = (appState.settings.reconUnits && appState.settings.reconUnits[itemId]) || 'base';

        let displayVal = currentSold;
        if (prefUnit === 'sell') displayVal = Number((currentSold * (item.conversionRate || 1)).toFixed(2));
        if (prefUnit === 'mwk') displayVal = Number((currentSold * (item.conversionRate || 1) * item.sellPrice).toFixed(2));

        const bodyHtml = [
          '<div style="font-size:0.84rem; color:var(--muted); margin-bottom:12px; line-height:1.5;">',
          '  Sold quantities are automatically compiled from customer transactions in your POS sales log for this shift. Override only if off-register sales occurred.',
          '</div>',
          '<div style="background:#F7F4EC; border:1px solid #ECE7D9; border-radius:6px; padding:10px 12px; margin-bottom:14px; font-size:0.85rem;">',
          '  <div style="display:flex; justify-content:space-between; margin-bottom:4px;">',
          '    <span style="color:var(--muted);">POS Register Sales:</span>',
          '    <strong class="mono">' + formatNum(logSold, 2) + ' ' + item.baseUnit + (logSold === 1 ? '' : 's') + (item.conversionRate > 1 ? ' (' + formatNum(logSold * item.conversionRate, 0) + ' ' + item.sellUnit + 's)' : '') + '</strong>',
          '  </div>',
          '  <div style="display:flex; justify-content:space-between;">',
          '    <span style="color:var(--muted);">Current Mode:</span>',
          (isOverridden
            ? '    <span style="color:var(--brass-dark); font-weight:700;">⚠ Manual Override Active</span>'
            : '    <span style="color:var(--good); font-weight:700;">✓ Synced with Sales Log</span>'),
          '  </div>',
          '</div>',
          '<div class="form-group" style="margin-bottom:14px;">',
          '  <label style="font-size:0.8rem; font-weight:600; margin-bottom:4px; display:block;">Sold Quantity for this Shift</label>',
          '  <div style="display:flex; gap:6px;">',
          '    <input type="number" step="any" min="0" id="modal-sold-val" class="form-input mono" value="' + displayVal + '" style="min-height:40px; font-size:1rem; flex:1;">',
          '    <select id="modal-sold-unit" class="form-select mono" style="width:130px; min-height:40px; font-size:0.84rem;">',
          '      <option value="base"' + (prefUnit === 'base' ? ' selected' : '') + '>' + item.baseUnit + 's</option>',
          (item.conversionRate > 1 ? '<option value="sell"' + (prefUnit === 'sell' ? ' selected' : '') + '>' + item.sellUnit + 's</option>' : ''),
          '      <option value="mwk"' + (prefUnit === 'mwk' ? ' selected' : '') + '>MWK Value</option>',
          '    </select>',
          '  </div>',
          '</div>',
          '<div style="display:flex; gap:8px; margin-top:16px;">',
          (isOverridden ? '  <button type="button" class="btn btn-outline" id="modal-reset-sold" style="flex:1; min-height:40px; font-size:0.82rem;">↺ Reset to POS Log</button>' : ''),
          '  <button type="button" class="btn btn-brass" id="modal-save-sold" style="flex:1; min-height:40px; font-weight:700; font-size:0.88rem;">Save Sold Figure</button>',
          '</div>'
        ].join('');

        openSheet('Adjust Sold: ' + item.name, bodyHtml, function(close) {
          const input = document.getElementById('modal-sold-val');
          const select = document.getElementById('modal-sold-unit');
          const saveBtn = document.getElementById('modal-save-sold');
          const resetBtn = document.getElementById('modal-reset-sold');

          if (saveBtn) {
            saveBtn.addEventListener('click', function() {
              const val = Number(input.value) || 0;
              const u = select ? select.value : 'base';
              let baseUnits = val;
              if (u === 'sell') baseUnits = val / (item.conversionRate || 1);
              if (u === 'mwk') baseUnits = (val / (item.sellPrice || 1)) / (item.conversionRate || 1);

              cd.manualSold[itemId] = Number(baseUnits.toFixed(4));
              if (!appState.settings.reconUnits) appState.settings.reconUnits = {};
              appState.settings.reconUnits[itemId] = u;
              schedulePersist();
              close();
              showToast('Updated sold figure for ' + item.name);
              renderReconcile();
            });
          }

          if (resetBtn) {
            resetBtn.addEventListener('click', function() {
              delete cd.manualSold[itemId];
              schedulePersist();
              close();
              showToast('Reset sold figure to POS log for ' + item.name);
              renderReconcile();
            });
          }
        });
      }

      function renderReconcile() {
        const container = document.getElementById('view-reconcile');
        if (!container) return;

        ensureDayShape(appState.currentDay);
        const cd = appState.currentDay;
        const isToday = cd.date === getTodayStr();

        let totalExpectedLoss = 0;
        let totalCountedItems = 0;
        const allItems = appState.inventory;
        const totalItemsCount = allItems.length;

        // Calculate variance losses across all items
        allItems.forEach(function(item) {
          const exp = getExpectedStock(item);
          const act = cd.actual[item.id];
          if (act !== undefined && act !== null) {
            totalCountedItems++;
            const variance = exp - act;
            if (variance > 0) {
              totalExpectedLoss += variance * item.buyPrice;
            }
          }
        });

        const percentCounted = totalItemsCount > 0 ? Math.round((totalCountedItems / totalItemsCount) * 100) : 0;

        // Day revenue & cogs for current open shift
        let dayRevenue = 0;
        let dayCogs = 0;
        const payBreakdown = {};
        appState.salesLog.forEach(function(s) {
          if (s.date === cd.date && !s.voided) {
            dayRevenue += s.total;
            const conv = s.convSnap || 1;
            const baseQty = s.unitType === 'sell' ? (s.qty / conv) : s.qty;
            dayCogs += baseQty * (s.costSnap || 0);
            payBreakdown[s.payment] = (payBreakdown[s.payment] || 0) + s.total;
          }
        });
        const grossProfit = dayRevenue - dayCogs;

        // Categorize items
        const pendingItems = allItems.filter(function(i) {
          return cd.actual[i.id] === undefined || cd.actual[i.id] === null;
        });
        const reconciledItems = allItems.filter(function(i) {
          return cd.actual[i.id] !== undefined && cd.actual[i.id] !== null;
        });

        // Determine base display items before search/category filters
        let baseItems = pendingItems;
        if (reconFilter === 'reconciled') baseItems = reconciledItems;
        if (reconFilter === 'all') baseItems = allItems;

        // Categories list for filter dropdown
        const categories = [];
        allItems.forEach(function(i) {
          if (i.category && categories.indexOf(i.category) === -1) {
            categories.push(i.category);
          }
        });

        // Apply search and category filter for item views
        const query = reconSearchQuery.trim().toLowerCase();
        const displayItems = baseItems.filter(function(item) {
          if (reconCategoryFilter !== 'all' && item.category !== reconCategoryFilter) return false;
          if (query && item.name.toLowerCase().indexOf(query) === -1 && item.category.toLowerCase().indexOf(query) === -1) return false;
          return true;
        });

        const html = [
          // Smart Summary Header
          '<div class="recon-summary-card">',
          '  <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">',
          '    <div>',
          '      <div style="font-size:0.68rem; text-transform:uppercase; font-weight:700; color:var(--muted); letter-spacing:0.04em;">Current Shift Reconciler</div>',
          '      <div class="mono" style="font-size:1.1rem; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:6px;">',
          '        ' + cd.date,
          (isToday ? ' <span class="badge-tag badge-open" style="font-size:0.7rem;">Today’s Shift</span>' : ' <span class="badge-tag badge-stale" style="font-size:0.7rem;">Stale Date</span>'),
          '      </div>',
          '    </div>',
          '    <div style="display:flex; gap:6px; flex-wrap:wrap;">',
          '      <button type="button" class="btn btn-outline btn-sm" id="btn-fill-all-expected" style="min-height:34px; font-size:0.76rem; padding:0 10px; background:#FCFBF8;" title="Match all expected stock in 1 click">',
          '        ⚡ Match All (= Exp)',
          '      </button>',
          (reconFilter !== 'summary' ? [
            '      <button type="button" class="btn btn-brass btn-sm" id="btn-quick-close-shift" style="min-height:34px; font-size:0.76rem; padding:0 12px; font-weight:700;">',
            '        Finalize Shift →',
            '      </button>'
          ].join('') : ''),
          '    </div>',
          '  </div>',

          // 3-box Metric Grid
          '  <div class="recon-metric-grid">',
          '    <div class="recon-metric-box">',
          '      <div style="display:flex; justify-content:space-between; align-items:center;">',
          '        <span style="font-size:0.68rem; text-transform:uppercase; font-weight:700; color:var(--muted);">Count Progress</span>',
          '        <span class="mono" style="font-size:0.78rem; font-weight:700; color:' + (percentCounted === 100 ? 'var(--good)' : 'var(--brass-dark)') + ';">' + totalCountedItems + ' / ' + totalItemsCount + ' (' + percentCounted + '%)</span>',
          '      </div>',
          '      <div style="background:#E2DDD1; border-radius:6px; height:6px; overflow:hidden; margin-top:6px;">',
          '        <div style="background:' + (percentCounted === 100 ? 'var(--good)' : 'var(--brass)') + '; height:100%; width:' + percentCounted + '%; transition:width 0.25s ease;"></div>',
          '      </div>',
          '    </div>',
          '    <div class="recon-metric-box">',
          '      <span style="font-size:0.68rem; text-transform:uppercase; font-weight:700; color:var(--muted); display:block;">Shift Revenue</span>',
          '      <div class="mono" style="font-size:1.05rem; font-weight:700; color:var(--ink); margin-top:2px;">' + formatMWK(dayRevenue) + '</div>',
          '    </div>',
          '    <div class="recon-metric-box">',
          '      <span style="font-size:0.68rem; text-transform:uppercase; font-weight:700; color:var(--muted); display:block;">Shrinkage Loss</span>',
          '      <div class="mono ' + (totalExpectedLoss > 0 ? 'text-danger' : 'text-good') + '" style="font-size:1.05rem; font-weight:700; margin-top:2px;">' +
          (totalExpectedLoss > 0 ? '⚠ ' + formatMWK(totalExpectedLoss) : '✓ Zero Loss') +
          '      </div>',
          '    </div>',
          '  </div>',
          '</div>',

          // Stale Day Warning
          (!isToday ? [
            '<div style="background:#FFF3CD; border:1px solid #FFEBAA; color:#856404; padding:8px 12px; border-radius:6px; margin-bottom:12px; font-size:0.82rem; display:flex; justify-content:space-between; align-items:center;">',
            '  <div>⚠ <strong>Note:</strong> Shift is dated <strong>' + cd.date + '</strong>. Reconcile and finalize below to roll over to today.</div>',
            '</div>'
          ].join('') : ''),

          // Clean Segmented Tabs
          '<div class="toggle-group" style="margin-bottom:12px; display:flex; overflow-x:auto;">',
          '  <button type="button" class="toggle-btn ' + (reconFilter === 'pending' ? 'active' : '') + '" id="btn-recon-filter-pending" style="flex:1; padding:0 8px; font-size:0.8rem; white-space:nowrap;">',
          '    To Count (' + pendingItems.length + ')',
          '  </button>',
          '  <button type="button" class="toggle-btn ' + (reconFilter === 'reconciled' ? 'active' : '') + '" id="btn-recon-filter-done" style="flex:1; padding:0 8px; font-size:0.8rem; white-space:nowrap;">',
          '    ✓ Counted (' + reconciledItems.length + ')',
          '  </button>',
          '  <button type="button" class="toggle-btn ' + (reconFilter === 'summary' ? 'active' : '') + '" id="btn-recon-filter-summary" style="flex:1; padding:0 8px; font-size:0.8rem; white-space:nowrap;">',
          '    📊 Shift Report',
          '  </button>',
          '  <button type="button" class="toggle-btn ' + (reconFilter === 'all' ? 'active' : '') + '" id="btn-recon-filter-all" style="flex:1; padding:0 8px; font-size:0.8rem; white-space:nowrap;">',
          '    All Items (' + totalItemsCount + ')',
          '  </button>',
          '</div>'
        ];

        // -----------------------------------------------------------------
        // BRANCH A: Shift Report & Close Tab
        // -----------------------------------------------------------------
        if (reconFilter === 'summary') {
          // Discrepancy items
          const itemsWithVariance = [];
          allItems.forEach(function(item) {
            const exp = getExpectedStock(item);
            const act = cd.actual[item.id];
            if (act !== undefined && act !== null) {
              const diff = Number((exp - act).toFixed(4));
              if (Math.abs(diff) >= 0.001) {
                itemsWithVariance.push({
                  item: item,
                  expected: exp,
                  actual: act,
                  diff: diff,
                  lossMWK: diff > 0 ? diff * item.buyPrice : 0
                });
              }
            }
          });

          // Payment badges
          let paySummaryBadges = Object.keys(payBreakdown).map(function(m) {
            return '<span class="badge-tag" style="background:#F4EFE3; font-size:0.8rem; padding:4px 8px; border:1px solid var(--line);">' +
              m + ': <strong class="mono" style="margin-left:4px;">' + formatMWK(payBreakdown[m]) + '</strong>' +
            '</span>';
          }).join('');
          if (!paySummaryBadges) {
            paySummaryBadges = '<span style="color:var(--muted); font-size:0.85rem;">No customer sales recorded for this shift yet.</span>';
          }

          html.push([
            // 1. Shift Count Status
            '<div class="card" style="margin-bottom:12px;">',
            (pendingItems.length > 0 ? [
              '<div style="display:flex; justify-content:space-between; align-items:center; background:#FFF8E8; border:1px solid #FFE29E; padding:10px 12px; border-radius:6px; font-size:0.85rem;">',
              '  <div>⚠ <strong>' + pendingItems.length + ' items</strong> still pending count before closing shift.</div>',
              '  <button type="button" class="btn btn-outline btn-sm" id="btn-recon-summary-goto-pending" style="min-height:30px; font-size:0.75rem; padding:0 10px; white-space:nowrap;">Go to Count →</button>',
              '</div>'
            ].join('') : [
              '<div style="background:var(--good-bg); color:var(--good); padding:10px 12px; border-radius:6px; font-size:0.85rem; font-weight:600; display:flex; align-items:center; gap:6px;">',
              '  <span>✓</span> All ' + totalItemsCount + ' inventory items counted and reconciled for this shift!',
              '</div>'
            ].join('')),
            '</div>',

            // 2. Financial Performance Grid
            '<div class="card" style="margin-bottom:12px;">',
            '  <h4 style="font-size:0.92rem; font-weight:700; margin-bottom:10px;">Shift Financial Performance</h4>',
            '  <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; margin-bottom:12px;">',
            '    <div style="background:#F7F4EC; padding:10px 12px; border-radius:6px; border-left:3px solid var(--brass);">' +
            '      <div style="font-size:0.7rem; color:var(--muted); text-transform:uppercase; font-weight:600;">Gross Revenue</div>' +
            '      <div class="mono" style="font-size:1.15rem; font-weight:700; color:var(--ink);">' + formatMWK(dayRevenue) + '</div>' +
            '    </div>',
            '    <div style="background:#F7F4EC; padding:10px 12px; border-radius:6px; border-left:3px solid var(--muted);">' +
            '      <div style="font-size:0.7rem; color:var(--muted); text-transform:uppercase; font-weight:600;">Cost of Goods (COGS)</div>' +
            '      <div class="mono" style="font-size:1.15rem; font-weight:700; color:var(--ink);">' + formatMWK(dayCogs) + '</div>' +
            '    </div>',
            '    <div style="background:#F7F4EC; padding:10px 12px; border-radius:6px; border-left:3px solid var(--good);">' +
            '      <div style="font-size:0.7rem; color:var(--muted); text-transform:uppercase; font-weight:600;">Gross Profit</div>' +
            '      <div class="mono text-good" style="font-size:1.15rem; font-weight:700;">' + formatMWK(grossProfit) + ' <span style="font-size:0.75rem; font-weight:500;">(' + (dayRevenue > 0 ? Math.round(grossProfit / dayRevenue * 100) : 0) + '%)</span></div>' +
            '    </div>',
            '    <div style="background:#F7F4EC; padding:10px 12px; border-radius:6px; border-left:3px solid ' + (totalExpectedLoss > 0 ? 'var(--danger)' : 'var(--good)') + ';">' +
            '      <div style="font-size:0.7rem; color:var(--muted); text-transform:uppercase; font-weight:600;">Shrinkage Loss</div>' +
            '      <div class="mono ' + (totalExpectedLoss > 0 ? 'text-danger' : 'text-good') + '" style="font-size:1.15rem; font-weight:700;">' + formatMWK(totalExpectedLoss) + '</div>' +
            '    </div>',
            '  </div>',
            '  <div style="border-top:1px solid var(--line); padding-top:10px;">',
            '    <div style="font-size:0.74rem; font-weight:700; color:var(--muted); margin-bottom:6px; text-transform:uppercase;">Payment Collections Breakdown</div>',
            '    <div style="display:flex; flex-wrap:wrap; gap:6px;">' + paySummaryBadges + '</div>',
            '  </div>',
            '</div>',

            // 3. Discrepancy Audit Table
            '<div class="card" style="margin-bottom:12px;">',
            '  <div class="flex-between" style="margin-bottom:8px;">',
            '    <h4 style="font-size:0.92rem; font-weight:700; margin:0;">Stock Count Variances</h4>',
            '    <span class="mono" style="font-size:0.8rem; color:var(--muted);">' + itemsWithVariance.length + ' discrepancy' + (itemsWithVariance.length === 1 ? '' : 'ies') + '</span>',
            '  </div>',
            (itemsWithVariance.length === 0 ? [
              '<div style="padding:12px; background:var(--good-bg); color:var(--good); border-radius:6px; font-size:0.85rem; font-weight:600;">',
              '  ✓ Perfect match: All counted items match expected quantities with zero shrinkage loss.',
              '</div>'
            ].join('') : [
              '<div style="overflow-x:auto;"><table class="dense-table">',
              '  <thead><tr><th>Item</th><th>Expected</th><th>Counted</th><th>Variance</th><th>Shrinkage Loss</th></tr></thead>',
              '  <tbody>' + itemsWithVariance.map(function(v) {
                   const it = v.item;
                   const isShort = v.diff > 0;
                   return '<tr>' +
                     '<td><strong>' + it.name + '</strong> <span style="font-size:0.72rem; color:var(--muted);">(' + it.category + ')</span></td>' +
                     '<td class="mono">' + formatNum(v.expected, 2) + ' ' + it.baseUnit + (v.expected === 1 ? '' : 's') + '</td>' +
                     '<td class="mono">' + formatNum(v.actual, 2) + ' ' + it.baseUnit + (v.actual === 1 ? '' : 's') + '</td>' +
                     '<td class="mono ' + (isShort ? 'text-danger' : 'text-good') + '" style="font-weight:600;">' +
                       (isShort ? '⚠ Short: ' + formatNum(v.diff, 2) : 'Surplus: +' + formatNum(Math.abs(v.diff), 2)) +
                     '</td>' +
                     '<td class="mono ' + (v.lossMWK > 0 ? 'text-danger' : '') + '" style="font-weight:600;">' + (v.lossMWK > 0 ? formatMWK(v.lossMWK) : '-') + '</td>' +
                   '</tr>';
                 }).join('') + '</tbody>',
              '</table></div>'
            ].join('')),
            '</div>',

            // 4. Shift Close Action Card
            '<div class="card" style="margin-bottom:14px; background:#F8F5EE; border:1px solid var(--brass);">',
            '  <h4 style="font-size:0.92rem; font-weight:700; margin-bottom:4px;">Finalize & Close Shift</h4>',
            '  <p style="font-size:0.8rem; color:var(--muted); margin-bottom:10px;">',
            '    Locks today’s sales and inventory, saves the reconciliation audit snapshot to history, updates stock on hand, and opens a fresh shift.',
            '  </p>',
            '  <button class="btn btn-brass" id="btn-close-day" style="width:100%; min-height:44px; font-size:0.95rem; font-weight:700;">',
            '    ✓ Finalize & Close Day Shift',
            '  </button>',
            '</div>',

            // 5. Past Reconciliations History
            '<div class="card">',
            '  <div class="flex-between" style="margin-bottom:8px;">',
            '    <h4 style="font-size:0.92rem; font-weight:700; margin:0;">Past Reconciliations (' + appState.closedDays.length + ')</h4>',
            (appState.closedDays.length > 0 ? '    <button class="btn btn-outline btn-sm" id="btn-export-closed-csv" style="min-height:30px; font-size:0.75rem;">Export CSV</button>' : ''),
            '  </div>'
          ]);

          if (appState.closedDays.length === 0) {
            html.push('<div style="text-align:center; padding:16px; color:var(--muted); font-size:0.84rem;">No historical closed shifts recorded yet.</div>');
          } else {
            appState.closedDays.slice().reverse().forEach(function(closed) {
              html.push([
                '<div style="border:1px solid var(--line); border-radius:6px; margin-bottom:8px; overflow:hidden;">',
                '  <div class="flex-between" style="padding:8px 12px; background:#F7F4EC; cursor:pointer;" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'">',
                '    <div>',
                '      <strong class="mono" style="font-size:0.92rem;">' + closed.date + '</strong>',
                '      <div style="font-size:0.74rem; color:var(--muted);">Revenue: ' + formatMWK(closed.revenue) + ' · Profit: ' + formatMWK(closed.grossProfit) + '</div>',
                '    </div>',
                '    <div class="text-right">',
                '      <span class="mono ' + (closed.lossValue > 0 ? 'text-danger' : 'text-good') + '" style="font-size:0.82rem; font-weight:700;">Loss: ' + formatMWK(closed.lossValue) + '</span>',
                '      <span style="font-size:0.7rem; color:var(--muted); display:block;">Details ▼</span>',
                '    </div>',
                '  </div>',
                '  <div style="display:none; padding:10px; border-top:1px solid var(--line); background:#FFF;">',
                '    <div style="overflow-x:auto;"><table class="dense-table">',
                '      <thead><tr><th>Item</th><th>Opening</th><th>In</th><th>Sold</th><th>Expected</th><th>Counted</th><th>Variance</th><th>Loss MWK</th></tr></thead>',
                '      <tbody>'
              ].join(''));

              if (Array.isArray(closed.items)) {
                closed.items.forEach(function(it) {
                  html.push([
                    '<tr>',
                    '  <td><strong>' + it.name + '</strong></td>',
                    '  <td class="mono">' + formatNum(it.opening, 1) + '</td>',
                    '  <td class="mono">' + formatNum(it.adj, 1) + '</td>',
                    '  <td class="mono">' + formatNum(it.sold, 1) + '</td>',
                    '  <td class="mono">' + formatNum(it.expected, 1) + '</td>',
                    '  <td class="mono">' + formatNum(it.actual, 1) + '</td>',
                    '  <td class="mono ' + (it.variance > 0 ? 'text-danger' : (it.variance < 0 ? 'text-brass' : 'text-good')) + '">' + formatNum(it.variance, 2) + '</td>',
                    '  <td class="mono">' + (it.variance > 0 ? formatMWK(it.variance * it.buyPrice) : '-') + '</td>',
                    '</tr>'
                  ].join(''));
                });
              }

              html.push('</tbody></table></div></div></div>');
            });
          }

          html.push('</div>'); // end card
        } else {
          // -----------------------------------------------------------------
          // BRANCH B: Item Reconcile Views ('pending', 'reconciled', or 'all')
          // -----------------------------------------------------------------

          // Search & Category Toolbar
          html.push([
            '<div style="display:flex; gap:6px; margin-bottom:10px; align-items:center;">',
            '  <input type="search" id="recon-search-input" class="form-input" placeholder="Search items to count..." value="' + (reconSearchQuery || '') + '" style="min-height:34px; font-size:0.82rem; flex:1; padding:4px 8px;">',
            (categories.length > 1 ? [
              '  <select id="recon-category-filter" class="form-select" style="min-height:34px; font-size:0.8rem; width:130px; padding:4px 6px;">',
              '    <option value="all"' + (reconCategoryFilter === 'all' ? ' selected' : '') + '>All Categories</option>',
              categories.map(function(c) {
                return '<option value="' + c + '"' + (reconCategoryFilter === c ? ' selected' : '') + '>' + c + '</option>';
              }).join(''),
              '  </select>'
            ].join('') : ''),
            '</div>'
          ].join(''));

          // Empty States
          if (reconFilter === 'pending' && pendingItems.length === 0) {
            html.push([
              '<div style="text-align:center; padding:28px 16px; background:#F8F5EE; border:1px dashed var(--good); border-radius:8px; margin-bottom:14px;">',
              '  <div style="font-size:2.2rem; color:var(--good); margin-bottom:6px;">✓</div>',
              '  <div style="font-size:1.1rem; font-weight:700; color:var(--ink); margin-bottom:4px;">All Items Reconciled!</div>',
              '  <p style="color:var(--muted); font-size:0.84rem; margin-bottom:14px; max-width:400px; margin-left:auto; margin-right:auto;">',
              '    Every item has been counted for this shift and cleared from the pending list. You can review counts or open the Shift Report to finalize.',
              '  </p>',
              '  <div style="display:flex; justify-content:center; gap:8px; flex-wrap:wrap;">',
              '    <button type="button" class="btn btn-outline btn-sm" id="btn-recon-view-done" style="min-height:36px; padding:0 14px;">Review Counted (' + reconciledItems.length + ')</button>',
              '    <button type="button" class="btn btn-brass btn-sm" id="btn-recon-jump-close" style="min-height:36px; padding:0 16px; font-weight:700;">📊 Shift Report & Close</button>',
              '  </div>',
              '</div>'
            ].join(''));
          } else if (reconFilter === 'reconciled' && reconciledItems.length === 0) {
            html.push([
              '<div style="text-align:center; padding:28px 16px; background:#FDFBF7; border:1px dashed var(--line); border-radius:8px; margin-bottom:14px;">',
              '  <div style="font-size:2rem; color:var(--muted); margin-bottom:6px;">📋</div>',
              '  <div style="font-weight:600; color:var(--ink); font-size:0.95rem; margin-bottom:4px;">No Counted Items Yet</div>',
              '  <p style="color:var(--muted); font-size:0.84rem; margin-bottom:12px;">Items will appear here once you enter their physical counts.</p>',
              '  <button type="button" class="btn btn-brass btn-sm" id="btn-recon-goto-pending" style="min-height:36px; padding:0 16px; font-weight:700;">Go to "To Count" (' + pendingItems.length + ')</button>',
              '</div>'
            ].join(''));
          } else if (displayItems.length === 0) {
            html.push([
              '<div style="text-align:center; padding:24px 16px; background:#FAF8F2; border-radius:6px; color:var(--muted); font-size:0.85rem;">',
              '  No items match your search/filter.',
              '</div>'
            ].join(''));
          }

          // Render Item Cards
          displayItems.forEach(function(item) {
            const expectedBase = getExpectedStock(item);
            const actualVal = cd.actual[item.id];
            const hasCount = (actualVal !== undefined && actualVal !== null);
            const isEditing = reconEditingCards[item.id] === true;
            const variance = hasCount ? Number((expectedBase - actualVal).toFixed(4)) : 0;
            const isMatch = hasCount && Math.abs(variance) < 0.001;
            const isShort = hasCount && variance > 0.0001;
            const isSurplus = hasCount && variance < -0.0001;

            // Arithmetic breakdown
            const op = Number(cd.opening[item.id]) || 0;
            const adj = Number(cd.netAdjustment[item.id]) || 0;
            const soldBase = getReconcileSoldBaseUnits(item.id);
            const isManualSold = (cd.manualSold && cd.manualSold[item.id] !== undefined && cd.manualSold[item.id] !== null);

            // Card styling
            let cardClass = 'recon-item-card uncounted';
            let statusBadge = '<span class="badge-tag" style="background:#ECE7D9; color:var(--muted); font-size:0.72rem;">Pending</span>';

            if (hasCount) {
              if (isMatch) {
                cardClass = 'recon-item-card matches';
                statusBadge = '<span class="badge-tag badge-open text-good" style="font-size:0.72rem;">✓ Matched (' + formatNum(actualVal, 1) + ')</span>';
              } else if (isShort) {
                cardClass = 'recon-item-card short';
                statusBadge = '<span class="badge-tag badge-stale" style="font-size:0.72rem;">⚠ Short -' + formatNum(variance, 1) + ' ' + item.baseUnit + (variance === 1 ? '' : 's') + '</span>';
              } else {
                cardClass = 'recon-item-card surplus';
                statusBadge = '<span class="badge-tag" style="background:#FEF3C7; color:var(--brass-dark); font-size:0.72rem;">+ Surplus +' + formatNum(Math.abs(variance), 1) + '</span>';
              }
            }

            const prefActUnit = (appState.settings.reconActualUnits && appState.settings.reconActualUnits[item.id]) || 'base';
            let displayActualVal = '';
            if (hasCount) {
              displayActualVal = prefActUnit === 'sell' ? Number((actualVal * (item.conversionRate || 1)).toFixed(2)) : actualVal;
            }

            const expFormatted = formatNum(expectedBase, 2) + ' ' + item.baseUnit + (expectedBase === 1 ? '' : 's') +
              (item.conversionRate > 1 ? ' (' + formatNum(expectedBase * item.conversionRate, 0) + ' ' + item.sellUnit + 's)' : '');

            html.push([
              '<div class="' + cardClass + '">',
              // Top Title Row
              '  <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">',
              '    <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">',
              '      <strong style="font-size:0.92rem; color:var(--ink);">' + item.name + '</strong>',
              '      <span class="badge-tag" style="background:#EAE5D9; font-size:0.68rem; text-transform:uppercase; font-weight:700; color:var(--ink-2);">' + item.category + '</span>',
              '    </div>',
              '    <div>' + statusBadge + '</div>',
              '  </div>',

              // Arithmetic Equation Strip
              '  <div class="recon-formula-strip">',
              '    <span class="recon-formula-node" title="Shift opening stock">',
              '      <span style="color:var(--muted);">Op:</span> <strong class="mono">' + formatNum(op, 1) + '</strong>',
              '    </span>',
              '    <span class="recon-formula-sep">+</span>',
              '    <span class="recon-formula-node" title="Restocks during shift">',
              '      <span style="color:var(--muted);">In:</span> <strong class="mono">' + (adj >= 0 ? '+' : '') + formatNum(adj, 1) + '</strong>',
              '    </span>',
              '    <span class="recon-formula-sep">-</span>',
              '    <span class="recon-formula-node" title="Sold today in shift">',
              '      <span style="color:var(--muted);">Sold:</span> <strong class="mono">' + formatNum(soldBase, 1) + '</strong>',
              '      <button type="button" class="btn-edit-sold" data-id="' + item.id + '" style="background:none; border:none; color:var(--brass-dark); cursor:pointer; font-size:0.72rem; padding:0 2px; text-decoration:underline;" title="Click to adjust sold quantity">' + (isManualSold ? '✎ Override' : '✎ Edit') + '</button>',
              '    </span>',
              '    <span class="recon-formula-sep">➔</span>',
              '    <span class="recon-formula-node" style="margin-left:auto;">',
              '      <span style="color:var(--muted); font-weight:600;">Exp:</span> <strong class="mono" style="color:var(--ink); font-size:0.84rem;">' + expFormatted + '</strong>',
              '    </span>',
              '  </div>',

              // Count Area
              (hasCount && !isEditing ? [
                '  <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:4px;">',
                '    <div style="font-size:0.82rem;">',
                '      Counted: <strong class="mono" style="font-size:0.92rem; color:var(--ink);">' + formatNum(actualVal, 2) + ' ' + item.baseUnit + (actualVal === 1 ? '' : 's') + (item.conversionRate > 1 ? ' (' + formatNum(actualVal * item.conversionRate, 0) + ' ' + item.sellUnit + 's)' : '') + '</strong>',
                '    </div>',
                '    <div style="display:flex; gap:6px;">',
                '      <button type="button" class="btn btn-outline btn-sm btn-edit-count" data-id="' + item.id + '" style="min-height:28px; font-size:0.74rem; padding:0 8px;">✎ Edit</button>',
                '      <button type="button" class="btn btn-outline btn-sm btn-reopen-recon" data-id="' + item.id + '" style="min-height:28px; font-size:0.74rem; padding:0 8px; color:var(--danger);" title="Reset count and move back to pending">↺ Reset</button>',
                '    </div>',
                '  </div>',
                (variance !== 0 ? [
                  '  <div class="recon-diff-bar ' + (isShort ? 'diff-short' : 'diff-surplus') + '">',
                  (isShort
                    ? '⚠ Short by ' + formatNum(variance, 2) + ' ' + item.baseUnit + (variance === 1 ? '' : 's') + ' (' + formatNum(variance * (item.conversionRate || 1), 0) + ' ' + item.sellUnit + 's) · Shrinkage Loss: ' + formatMWK(variance * item.buyPrice)
                    : 'Surplus by +' + formatNum(Math.abs(variance), 2) + ' ' + item.baseUnit + 's (' + formatNum(Math.abs(variance) * (item.conversionRate || 1), 0) + ' ' + item.sellUnit + 's) · Value: ' + formatMWK(Math.abs(variance) * item.buyPrice)),
                  '  </div>'
                ].join('') : [
                  '  <div class="recon-diff-bar diff-matches">',
                  '    ✓ Perfect match: Count matches expected stock exactly.',
                  '  </div>'
                ].join(''))
              ].join('') : [
                '  <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:4px;">',
                '    <div style="display:flex; align-items:center; gap:4px; flex:1 1 140px;">',
                '      <input type="number" step="any" min="0" class="form-input mono input-actual-val" data-id="' + item.id + '" placeholder="Count (' + formatNum(expectedBase, 1) + ')" value="' + (displayActualVal !== '' ? displayActualVal : '') + '" style="min-height:34px; font-size:0.88rem; flex:1; padding:4px 8px;">',
                '      <select class="form-select select-actual-unit mono" data-id="' + item.id + '" style="min-height:34px; font-size:0.76rem; width:' + (item.conversionRate > 1 ? '85px' : '72px') + '; padding:2px 4px;">',
                '        <option value="base"' + (prefActUnit === 'base' ? ' selected' : '') + '>' + item.baseUnit + 's</option>',
                (item.conversionRate > 1 ? '        <option value="sell"' + (prefActUnit === 'sell' ? ' selected' : '') + '>' + item.sellUnit + 's</option>' : ''),
                '      </select>',
                '    </div>',
                '    <div style="display:flex; gap:4px;">',
                '      <button type="button" class="btn btn-outline btn-sm btn-set-exp" data-id="' + item.id + '" data-exp="' + expectedBase + '" style="min-height:34px; font-size:0.75rem; padding:0 8px; white-space:nowrap; background:#FAF8F2;" title="Match expected count exactly">',
                '        ⚡ = Exp (' + formatNum(expectedBase, 1) + ')',
                '      </button>',
                '      <button type="button" class="btn btn-brass btn-sm btn-save-count" data-id="' + item.id + '" style="min-height:34px; font-size:0.75rem; padding:0 12px; font-weight:700; white-space:nowrap;">',
                '        ✓ Save',
                '      </button>',
                (isEditing ? '      <button type="button" class="btn btn-outline btn-sm btn-cancel-edit-count" data-id="' + item.id + '" style="min-height:34px; font-size:0.75rem; padding:0 8px;">Cancel</button>' : ''),
                '    </div>',
                '  </div>'
              ].join('')),
              '</div>'
            ].join(''));
          });
        }

        container.innerHTML = html.join('');

        // -----------------------------------------------------------------
        // Event Handlers for Reconcile Screen
        // -----------------------------------------------------------------

        // Search input
        const searchInput = document.getElementById('recon-search-input');
        if (searchInput) {
          searchInput.addEventListener('input', function() {
            reconSearchQuery = this.value;
            renderReconcile();
          });
        }

        // Category filter
        const categoryFilterSelect = document.getElementById('recon-category-filter');
        if (categoryFilterSelect) {
          categoryFilterSelect.addEventListener('change', function() {
            reconCategoryFilter = this.value;
            renderReconcile();
          });
        }

        // Segment Tabs
        const filterPendingBtn = document.getElementById('btn-recon-filter-pending');
        if (filterPendingBtn) {
          filterPendingBtn.addEventListener('click', function() {
            reconFilter = 'pending';
            renderReconcile();
          });
        }
        const filterDoneBtn = document.getElementById('btn-recon-filter-done');
        if (filterDoneBtn) {
          filterDoneBtn.addEventListener('click', function() {
            reconFilter = 'reconciled';
            renderReconcile();
          });
        }
        const filterSummaryBtn = document.getElementById('btn-recon-filter-summary');
        if (filterSummaryBtn) {
          filterSummaryBtn.addEventListener('click', function() {
            reconFilter = 'summary';
            renderReconcile();
          });
        }
        const filterAllBtn = document.getElementById('btn-recon-filter-all');
        if (filterAllBtn) {
          filterAllBtn.addEventListener('click', function() {
            reconFilter = 'all';
            renderReconcile();
          });
        }

        // Quick close header button
        const quickCloseBtn = document.getElementById('btn-quick-close-shift');
        if (quickCloseBtn) {
          quickCloseBtn.addEventListener('click', function() {
            reconFilter = 'summary';
            renderReconcile();
          });
        }

        const summaryGotoPendingBtn = document.getElementById('btn-recon-summary-goto-pending');
        if (summaryGotoPendingBtn) {
          summaryGotoPendingBtn.addEventListener('click', function() {
            reconFilter = 'pending';
            renderReconcile();
          });
        }

        const viewDoneBtn = document.getElementById('btn-recon-view-done');
        if (viewDoneBtn) {
          viewDoneBtn.addEventListener('click', function() {
            reconFilter = 'reconciled';
            renderReconcile();
          });
        }

        const gotoPendingBtn = document.getElementById('btn-recon-goto-pending');
        if (gotoPendingBtn) {
          gotoPendingBtn.addEventListener('click', function() {
            reconFilter = 'pending';
            renderReconcile();
          });
        }

        const jumpCloseBtn = document.getElementById('btn-recon-jump-close');
        if (jumpCloseBtn) {
          jumpCloseBtn.addEventListener('click', function() {
            reconFilter = 'summary';
            renderReconcile();
          });
        }

        // Edit Sold popup
        container.querySelectorAll('.btn-edit-sold').forEach(function(btn) {
          btn.addEventListener('click', function() {
            const itemId = this.getAttribute('data-id');
            openEditSoldModal(itemId);
          });
        });

        // Save count helper
        function saveItemCount(itemId) {
          const item = appState.inventory.find(function(i) { return i.id === itemId; });
          if (!item) return;

          const input = container.querySelector('.input-actual-val[data-id="' + itemId + '"]');
          const select = container.querySelector('.select-actual-unit[data-id="' + itemId + '"]');
          const rawVal = input ? input.value.trim() : '';

          if (rawVal === '') {
            showToast('Please enter counted value or tap ⚡ = Exp.', 'danger');
            if (input) input.focus();
            return;
          }

          const prefUnit = select ? select.value : ((appState.settings.reconActualUnits && appState.settings.reconActualUnits[itemId]) || 'base');
          const numVal = Number(rawVal) || 0;
          const baseUnits = prefUnit === 'sell' ? (numVal / (item.conversionRate || 1)) : numVal;

          cd.actual[itemId] = Number(baseUnits.toFixed(4));
          delete reconEditingCards[itemId];
          schedulePersist();
          showToast('Reconciled ' + item.name + ' (' + formatNum(numVal, 1) + ' ' + (prefUnit === 'sell' ? item.sellUnit : item.baseUnit) + 's)');
          renderReconcile();
        }

        // Enter key on count input
        container.querySelectorAll('.input-actual-val').forEach(function(input) {
          input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
              e.preventDefault();
              saveItemCount(this.getAttribute('data-id'));
            }
          });
        });

        // Save button
        container.querySelectorAll('.btn-save-count').forEach(function(btn) {
          btn.addEventListener('click', function() {
            saveItemCount(this.getAttribute('data-id'));
          });
        });

        // Edit count button
        container.querySelectorAll('.btn-edit-count').forEach(function(btn) {
          btn.addEventListener('click', function() {
            const itemId = this.getAttribute('data-id');
            reconEditingCards[itemId] = true;
            renderReconcile();
          });
        });

        // Cancel edit count
        container.querySelectorAll('.btn-cancel-edit-count').forEach(function(btn) {
          btn.addEventListener('click', function() {
            const itemId = this.getAttribute('data-id');
            delete reconEditingCards[itemId];
            renderReconcile();
          });
        });

        // Reset / Re-open count
        container.querySelectorAll('.btn-reopen-recon').forEach(function(btn) {
          btn.addEventListener('click', function() {
            const itemId = this.getAttribute('data-id');
            const item = appState.inventory.find(function(i) { return i.id === itemId; });
            delete cd.actual[itemId];
            delete reconEditingCards[itemId];
            schedulePersist();
            showToast('Re-opened ' + (item ? item.name : 'item') + ' for counting');
            renderReconcile();
          });
        });

        // Unit selector change
        container.querySelectorAll('.select-actual-unit').forEach(function(select) {
          select.addEventListener('change', function() {
            const itemId = this.getAttribute('data-id');
            if (!appState.settings.reconActualUnits) appState.settings.reconActualUnits = {};
            appState.settings.reconActualUnits[itemId] = this.value;
            schedulePersist();
            renderReconcile();
          });
        });

        // One-tap = Exp button
        container.querySelectorAll('.btn-set-exp').forEach(function(btn) {
          btn.addEventListener('click', function() {
            const itemId = this.getAttribute('data-id');
            const item = appState.inventory.find(function(i) { return i.id === itemId; });
            const exp = Number(this.getAttribute('data-exp')) || 0;
            cd.actual[itemId] = Math.max(0, exp);
            delete reconEditingCards[itemId];
            schedulePersist();
            showToast('Reconciled ' + (item ? item.name : 'item') + ' (= Expected)');
            renderReconcile();
          });
        });

        // Fill all from expected
        const fillAllBtn = document.getElementById('btn-fill-all-expected');
        if (fillAllBtn) {
          fillAllBtn.addEventListener('click', function() {
            askConfirm({
              title: 'Auto-Match All from Expected?',
              message: 'This will set the counted figure for all ' + totalItemsCount + ' items to match expected stock. All items will be reconciled.',
              okText: 'Match All',
              tone: 'brass'
            }).then(function(confirmed) {
              if (confirmed) {
                allItems.forEach(function(item) {
                  const exp = getExpectedStock(item);
                  cd.actual[item.id] = Math.max(0, exp);
                });
                reconEditingCards = {};
                schedulePersist();
                showToast('All items reconciled to expected stock.');
                renderReconcile();
              }
            });
          });
        }

        // Close Day & Start New Shift
        const closeDayBtn = document.getElementById('btn-close-day');
        if (closeDayBtn) {
          closeDayBtn.addEventListener('click', function() {
            const uncounted = allItems.filter(function(i) {
              return cd.actual[i.id] === undefined || cd.actual[i.id] === null;
            });

            let confirmPromise = Promise.resolve(true);
            if (uncounted.length > 0) {
              confirmPromise = askConfirm({
                title: uncounted.length + ' Uncounted Items',
                message: uncounted.length + ' items are still pending count. Do you want to assume their EXPECTED stock as the actual count and finalize the shift?',
                okText: 'Assume Expected & Close',
                tone: 'brass'
              }).then(function(ok) {
                if (ok) {
                  uncounted.forEach(function(it) {
                    cd.actual[it.id] = Math.max(0, getExpectedStock(it));
                  });
                  return true;
                }
                return false;
              });
            } else {
              confirmPromise = askConfirm({
                title: 'Finalize & Close Shift?',
                message: 'This will lock today’s sales, update stock on hand to your counted figures, record the reconciliation snapshot to history, and open a new shift for today (' + getTodayStr() + ').',
                okText: 'Close Day Shift',
                tone: 'brass'
              });
            }

            confirmPromise.then(function(canClose) {
              if (!canClose) return;

              let shiftLoss = 0;
              const closedItems = allItems.map(function(item) {
                const op = Number(cd.opening[item.id]) || 0;
                const adj = Number(cd.netAdjustment[item.id]) || 0;
                const sold = getReconcileSoldBaseUnits(item.id);
                const exp = getExpectedStock(item);
                const act = Number(cd.actual[item.id]) || 0;
                const diff = Number((exp - act).toFixed(4));
                if (diff > 0) shiftLoss += diff * item.buyPrice;

                return {
                  id: item.id,
                  name: item.name,
                  baseUnit: item.baseUnit,
                  buyPrice: item.buyPrice,
                  sellPrice: item.sellPrice,
                  opening: op,
                  adj: adj,
                  sold: sold,
                  expected: exp,
                  actual: act,
                  variance: diff
                };
              });

              const summary = {
                id: uuid(),
                date: cd.date,
                closedAt: new Date().toISOString(),
                revenue: dayRevenue,
                cogs: dayCogs,
                grossProfit: grossProfit,
                lossValue: shiftLoss,
                paymentBreakdown: payBreakdown,
                items: closedItems
              };

              appState.closedDays.push(summary);

              // Update item stock in inventory to match actual count
              allItems.forEach(function(item) {
                const act = cd.actual[item.id] !== undefined ? cd.actual[item.id] : getExpectedStock(item);
                item.stock = Math.max(0, Number(Number(act).toFixed(4)));
              });

              // Start new shift for today
              const newOpenings = {};
              allItems.forEach(function(item) {
                newOpenings[item.id] = item.stock;
              });

              appState.currentDay = {
                date: getTodayStr(),
                opening: newOpenings,
                netAdjustment: {},
                actual: {},
                manualSold: {}
              };

              reconFilter = 'pending';
              reconEditingCards = {};
              schedulePersist();
              showToast('Day closed successfully. New shift open!');
              updateHeaderStatus();
              renderReconcile();
              renderInventory();
            });
          });
        }

        const exportClosedCsvBtn = document.getElementById('btn-export-closed-csv');
        if (exportClosedCsvBtn) {
          exportClosedCsvBtn.addEventListener('click', function() {
            exportClosedDaysCSV();
          });
        }
      }

      // --- Navigation & View Switching ---
      function switchTab(tabName) {
        activeTab = tabName;
        document.querySelectorAll('.nav-tab').forEach(function(btn) {
          btn.classList.toggle('active', btn.getAttribute('data-view') === tabName);
        });

        document.querySelectorAll('.app-view').forEach(function(view) {
          view.style.display = 'none';
        });

        const target = document.getElementById('view-' + tabName);
        if (target) target.style.display = 'block';

        if (tabName === 'inventory') renderInventory();
        else if (tabName === 'sell') renderSell();
        else if (tabName === 'sales-log') renderSalesLog();
        else if (tabName === 'reconcile') renderReconcile();

        updateHeaderStatus();
        window.scrollTo({ top: 0, behavior: 'instant' });
      }

      function updateHeaderStatus() {
        const cd = appState.currentDay;
        const isToday = cd.date === getTodayStr();
        const tag = document.getElementById('header-day-tag');
        const staleBanner = document.getElementById('stale-banner');
        const staleDateLabel = document.getElementById('stale-date-label');

        if (tag) {
          tag.textContent = isToday ? 'Open Today' : cd.date;
          tag.className = 'badge-tag ' + (isToday ? 'badge-open' : 'badge-stale') + ' mono';
        }

        // Show banner on Sell and Reconcile views if stale
        if (staleBanner && staleDateLabel) {
          if (!isToday && (activeTab === 'sell' || activeTab === 'reconcile')) {
            staleDateLabel.textContent = cd.date;
            staleBanner.style.display = 'flex';
          } else {
            staleBanner.style.display = 'none';
          }
        }

        // Lock button visibility in header
        const btnLock = document.getElementById('btn-lock-now');
        if (btnLock) {
          btnLock.style.display = appState.settings && appState.settings.pin ? 'flex' : 'none';
        }
      }

      // --- CSV Exports (RFC 4180 with UTF-8 BOM) ---
      function downloadCSV(filename, rows) {
        const csvContent = rows.map(function(row) {
          return row.map(function(val) {
            const str = (val === null || val === undefined) ? '' : String(val);
            if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
              return '"' + str.replace(/"/g, '""') + '"';
            }
            return str;
          }).join(',');
        }).join('\r\n');

        const bom = '\uFEFF';
        const blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      function exportSalesCSV() {
        const rows = [
          ['Date', 'Time', 'Item Name', 'Quantity', 'Unit', 'Unit Price MWK', 'Total MWK', 'Unit Cost MWK', 'Staff', 'Payment Method', 'Voided']
        ];
        appState.salesLog.forEach(function(s) {
          rows.push([
            s.date,
            s.time,
            s.itemName,
            s.qty,
            s.unitLabelSnap,
            s.priceEach,
            s.total,
            s.costSnap,
            s.staff,
            s.payment,
            s.voided ? 'YES' : 'NO'
          ]);
        });
        downloadCSV('stockroom-sales-' + getTodayStr() + '.csv', rows);
        showToast('Exported Sales CSV');
      }

      function exportInventoryCSV() {
        const rows = [
          ['Item ID', 'Name', 'Category', 'Stock (Base Units)', 'Base Unit', 'Sell Unit', 'Portions per Base', 'Buy Price MWK', 'Sell Price MWK', 'Retail Value MWK', 'Low Stock Alert']
        ];
        appState.inventory.forEach(function(i) {
          const retailVal = i.stock * (i.conversionRate || 1) * i.sellPrice;
          rows.push([
            i.id,
            i.name,
            i.category,
            i.stock,
            i.baseUnit,
            i.sellUnit,
            i.conversionRate,
            i.buyPrice,
            i.sellPrice,
            retailVal,
            i.minAlert
          ]);
        });
        downloadCSV('stockroom-inventory-' + getTodayStr() + '.csv', rows);
        showToast('Exported Inventory CSV');
      }

      function exportClosedDaysCSV() {
        const rows = [
          ['Closed Date', 'Revenue MWK', 'COGS MWK', 'Gross Profit MWK', 'Variance Loss MWK', 'Closed Timestamp']
        ];
        appState.closedDays.forEach(function(d) {
          rows.push([
            d.date,
            d.revenue,
            d.cogs,
            d.grossProfit,
            d.lossValue,
            d.closedAt || ''
          ]);
        });
        downloadCSV('stockroom-reconciled-shifts-' + getTodayStr() + '.csv', rows);
        showToast('Exported Reconciled Shifts CSV');
      }

      // --- JSON Backup & Restore ---
      function downloadJSONBackup() {
        const json = JSON.stringify(appState, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'stockroom-backup-' + getTodayStr() + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Backup downloaded');
      }

      function handleRestoreFile(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          try {
            const data = JSON.parse(e.target.result);
            if (!data || !Array.isArray(data.inventory)) {
              alert('Invalid backup file. Must contain a valid Stockroom inventory array.');
              return;
            }

            // Schema migration check
            if (!data._schemaVersion) data._schemaVersion = 1;
            ensureDayShape(data.currentDay);

            askConfirm({
              title: 'Restore Backup?',
              message: 'This backup contains ' + data.inventory.length + ' items and ' + (data.salesLog ? data.salesLog.length : 0) + ' sales records. RESTORING WILL OVERWRITE ALL EXISTING DATA!',
              okText: 'Restore & Overwrite',
              tone: 'danger'
            }).then(function(confirmed) {
              if (confirmed) {
                appState = data;
                rawStorageSet(STORAGE_KEY, JSON.stringify(appState)).then(function() {
                  showToast('Backup restored successfully!');
                  switchTab('inventory');
                });
              }
            });
          } catch(err) {
            alert('Could not parse JSON file: ' + err.message);
          }
        };
        reader.readAsText(file);
      }

      // --- Settings & PIN Lock ---
      let enteredPin = '';
      let isAppLocked = false;
      let lastActivityTime = Date.now();
      let idleInterval = null;

      function triggerLock() {
        if (!appState.settings || !appState.settings.pin) return;
        isAppLocked = true;
        enteredPin = '';
        updatePinDisplay();
        document.getElementById('lock-overlay').style.display = 'flex';
      }

      function unlockApp() {
        isAppLocked = false;
        enteredPin = '';
        document.getElementById('lock-overlay').style.display = 'none';
        lastActivityTime = Date.now();
        showToast('Unlocked');
      }

      function updatePinDisplay() {
        const dots = document.getElementById('lock-pin-dots');
        if (dots) {
          dots.textContent = enteredPin.length > 0 ? '●'.repeat(enteredPin.length) : '----';
        }
      }

      function handleKeypadPress(k) {
        if (k === 'clear') {
          enteredPin = '';
        } else if (k === 'back') {
          enteredPin = enteredPin.slice(0, -1);
        } else if (enteredPin.length < 6) {
          enteredPin += k;
        }
        updatePinDisplay();

        if (enteredPin === appState.settings.pin) {
          unlockApp();
        } else if (enteredPin.length >= (appState.settings.pin || '4').length) {
          setTimeout(function() {
            if (enteredPin !== appState.settings.pin) {
              showToast('Incorrect PIN');
              enteredPin = '';
              updatePinDisplay();
            }
          }, 150);
        }
      }

      function resetUserActivity() {
        lastActivityTime = Date.now();
      }

      function initIdleTimer() {
        ['click', 'touchstart', 'keydown', 'scroll'].forEach(function(evt) {
          window.addEventListener(evt, resetUserActivity, { passive: true });
        });

        if (idleInterval) clearInterval(idleInterval);
        idleInterval = setInterval(function() {
          if (!appState || !appState.settings || !appState.settings.idleLock || !appState.settings.pin) return;
          if (isAppLocked) return;
          const idleLimitMs = (Number(appState.settings.idleMinutes) || 10) * 60 * 1000;
          if (Date.now() - lastActivityTime > idleLimitMs) {
            triggerLock();
          }
        }, 10000);
      }

      // Settings Sheet
      function openSettingsSheet() {
        const st = appState.settings || {};
        const html = [
          '<div style="margin-bottom:14px;">',
          '  <h3 style="font-size:1rem; font-weight:700; margin-bottom:4px;">App Security & PIN</h3>',
          '  <div class="form-group">',
          '    <label>Security PIN (Leave blank to disable lock)</label>',
          '    <input type="password" maxlength="6" class="form-input mono" id="settings-pin" value="' + (st.pin || '') + '" placeholder="e.g. 1234">',
          '  </div>',
          '  <div class="form-group">',
          '    <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">',
          '      <input type="checkbox" id="settings-idle-lock"' + (st.idleLock ? ' checked' : '') + ' style="width:18px; height:18px;">',
          '      <span>Enable Auto-Lock when idle</span>',
          '    </label>',
          '  </div>',
          '  <div class="form-group">',
          '    <label>Idle Lock Timeout</label>',
          '    <select class="form-select" id="settings-idle-min">',
          '      <option value="5"' + (st.idleMinutes == 5 ? ' selected' : '') + '>5 Minutes</option>',
          '      <option value="10"' + (st.idleMinutes == 10 ? ' selected' : '') + '>10 Minutes</option>',
          '      <option value="15"' + (st.idleMinutes == 15 ? ' selected' : '') + '>15 Minutes</option>',
          '      <option value="30"' + (st.idleMinutes == 30 ? ' selected' : '') + '>30 Minutes</option>',
          '    </select>',
          '  </div>',
          '</div>',
          '<div style="border-top:1px solid var(--line); padding-top:14px; margin-bottom:14px;">',
          '  <h3 style="font-size:1rem; font-weight:700; margin-bottom:8px;">Data & Exports</h3>',
          '  <div style="display:flex; flex-direction:column; gap:6px;">',
          '    <button class="btn btn-outline" id="btn-settings-export-json">Download Full Backup (JSON)</button>',
          '    <button class="btn btn-outline" id="btn-settings-export-inv">Export Inventory CSV</button>',
          '    <button class="btn btn-outline" id="btn-settings-export-sales">Export Sales Log CSV</button>',
          '    <button class="btn btn-outline" id="btn-settings-export-closed">Export Closed Shifts CSV</button>',
          '  </div>',
          '</div>',
          '<div style="border-top:1px solid var(--line); padding-top:14px;">',
          '  <h3 style="font-size:1rem; font-weight:700; color:var(--danger); margin-bottom:8px;">Danger Zone</h3>',
          '  <button class="btn btn-outline btn-danger btn-block" id="btn-settings-reset" style="color:var(--danger); border-color:var(--danger);">Reset to Default Sample Data</button>',
          '</div>'
        ].join('');

        openSheet('Settings & Preferences', html, function(closeSheet) {
          const pinInput = document.getElementById('settings-pin');
          const idleCheck = document.getElementById('settings-idle-lock');
          const idleMin = document.getElementById('settings-idle-min');

          function saveSettings() {
            appState.settings.pin = pinInput.value.trim();
            appState.settings.idleLock = idleCheck.checked;
            appState.settings.idleMinutes = Number(idleMin.value) || 10;
            schedulePersist();
            updateHeaderStatus();
          }

          pinInput.addEventListener('change', saveSettings);
          idleCheck.addEventListener('change', saveSettings);
          idleMin.addEventListener('change', saveSettings);

          document.getElementById('btn-settings-export-json').addEventListener('click', downloadJSONBackup);
          document.getElementById('btn-settings-export-inv').addEventListener('click', exportInventoryCSV);
          document.getElementById('btn-settings-export-sales').addEventListener('click', exportSalesCSV);
          document.getElementById('btn-settings-export-closed').addEventListener('click', exportClosedDaysCSV);

          document.getElementById('btn-settings-reset').addEventListener('click', function() {
            askConfirm({
              title: 'Reset All Data?',
              message: 'This will erase all recorded sales, inventory edits, and shift reconciliation history, returning to default sample items. This cannot be undone!',
              okText: 'Reset Everything',
              tone: 'danger'
            }).then(function(confirmed) {
              if (confirmed) {
                appState = getDefaultData();
                rawStorageSet(STORAGE_KEY, JSON.stringify(appState)).then(function() {
                  showToast('Stockroom data reset to defaults');
                  closeSheet();
                  switchTab('inventory');
                });
              }
            });
          });
        });
      }

      // Backup & Restore Sheet
      function openBackupSheet() {
        const html = [
          '<div class="card" style="margin-bottom:12px;">',
          '  <h3 style="font-size:1rem; font-weight:700; margin-bottom:6px;">Create Backup</h3>',
          '  <p style="font-size:0.85rem; color:var(--muted); margin-bottom:10px;">Download your full venue state as a single JSON file. You can restore this file on any phone or computer.</p>',
          '  <button class="btn btn-brass btn-block" id="btn-sheet-download-backup">Download Full JSON Backup</button>',
          '</div>',
          '<div class="card">',
          '  <h3 style="font-size:1rem; font-weight:700; margin-bottom:6px;">Restore from Backup</h3>',
          '  <p style="font-size:0.85rem; color:var(--muted); margin-bottom:10px;">Select a previously saved Stockroom JSON backup to restore venue data.</p>',
          '  <input type="file" id="input-restore-file" accept=".json,application/json" style="display:none;">',
          '  <button class="btn btn-outline btn-block" id="btn-sheet-choose-file">Select Backup File (.json)...</button>',
          '</div>'
        ].join('');

        openSheet('Backup & Restore', html, function(closeSheet) {
          document.getElementById('btn-sheet-download-backup').addEventListener('click', function() {
            downloadJSONBackup();
          });

          const fileInput = document.getElementById('input-restore-file');
          document.getElementById('btn-sheet-choose-file').addEventListener('click', function() {
            fileInput.click();
          });

          fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
              handleRestoreFile(this.files[0]);
              closeSheet();
            }
          });
        });
      }

      // --- Boot Sequence with Safe Try/Catch ---
      async function boot() {
        try {
          const raw = await storageGet(STORAGE_KEY);
          if (raw) {
            try {
              appState = JSON.parse(raw);
            } catch(e) {
              console.warn('Failed to parse existing state, using defaults', e);
              appState = getDefaultData();
            }
          } else {
            appState = getDefaultData();
            await rawStorageSet(STORAGE_KEY, JSON.stringify(appState));
          }

          // Schema check & migrations
          if (!appState._schemaVersion) appState._schemaVersion = 1;
          if (!Array.isArray(appState.inventory)) appState.inventory = [];
          if (!Array.isArray(appState.salesLog)) appState.salesLog = [];
          if (!Array.isArray(appState.stockMoves)) appState.stockMoves = [];
          if (!Array.isArray(appState.issuances)) appState.issuances = [];
          if (!Array.isArray(appState.closedDays)) appState.closedDays = [];
          if (!Array.isArray(appState.categories)) appState.categories = ['Beer', 'Spirits', 'Wine', 'Soft Drink', 'Mixers', 'Snacks'];
          if (!Array.isArray(appState.staffList)) appState.staffList = ['Staff'];
          if (!appState.settings) appState.settings = { pin: '', idleLock: false, idleMinutes: 10 };

          if (Array.isArray(appState.inventory)) {
            appState.inventory.forEach(function(item) {
              if (item.storeStock === undefined || item.barStock === undefined) {
                const tot = Number(item.stock) || 0;
                const initialBar = Math.min(tot, item.minAlert ? Number(item.minAlert) : 12);
                item.barStock = Number(initialBar.toFixed(2));
                item.storeStock = Number(Math.max(0, tot - item.barStock).toFixed(2));
                item.stock = Number(((item.storeStock || 0) + (item.barStock || 0)).toFixed(2));
              }
            });
          }

          ensureDayShape(appState.currentDay);

          // Wire up global nav & header buttons
          document.querySelectorAll('.nav-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
              switchTab(this.getAttribute('data-view'));
            });
          });

          document.getElementById('btn-settings-header').addEventListener('click', openSettingsSheet);
          document.getElementById('btn-backup-header').addEventListener('click', openBackupSheet);
          document.getElementById('btn-lock-now').addEventListener('click', triggerLock);

          document.getElementById('btn-stale-goto-reconcile').addEventListener('click', function() {
            switchTab('reconcile');
          });

          // Keypad buttons
          document.querySelectorAll('.key-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
              handleKeypadPress(this.getAttribute('data-k'));
            });
          });

          document.getElementById('btn-forgot-pin').addEventListener('click', function() {
            askConfirm({
              title: 'Forgot PIN?',
              message: 'Clear PIN lock? This requires confirmation to prevent unauthorized access.',
              okText: 'Clear PIN & Unlock',
              tone: 'danger'
            }).then(function(confirmed) {
              if (confirmed) {
                appState.settings.pin = '';
                appState.settings.idleLock = false;
                schedulePersist();
                unlockApp();
                showToast('PIN cleared');
              }
            });
          });

          initIdleTimer();
          switchTab('inventory');
          updateHeaderStatus();

        } catch (bootErr) {
          console.error("Critical boot failure:", bootErr);
          const recScreen = document.getElementById('recovery-screen');
          if (recScreen) {
            recScreen.style.display = 'block';
            document.getElementById('btn-recovery-export').addEventListener('click', function() {
              storageGet(STORAGE_KEY).then(function(data) {
                const blob = new Blob([data || '{}'], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'stockroom-salvaged-data.json';
                a.click();
              });
            });
            document.getElementById('btn-recovery-reset').addEventListener('click', function() {
              rawStorageSet(STORAGE_KEY, JSON.stringify(getDefaultData())).then(function() {
                window.location.reload();
              });
            });
          }
        }
      }

      // Run boot on DOMContentLoaded
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }

    })();
  </script>
</body>
